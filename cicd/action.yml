name: "Batho Index"
description: "Run Batho to index a repository and upload the .ctn artifacts (graph.json, bsg.json, architecture.md) as a workflow artifact."
author: "Batho"
branding:
  icon: "layers"
  color: "purple"

inputs:
  root:
    description: "Path to the repo root to index (relative to GITHUB_WORKSPACE)."
    required: false
    default: "."
  python-version:
    description: "Python version to install via uv."
    required: false
    default: "3.12"
  batho-ref:
    description: |
      How to install Batho.
        - "" (default): install from this action's checkout (${GITHUB_ACTION_PATH}). Use this until Batho is published to PyPI.
        - a git ref (e.g. "main", "v0.1.3", or a commit sha): install via "git+https://github.com/sageoz/batho@<ref>".
    required: false
    default: ""
  extensions:
    description: "Optional space-separated list of file extensions to include (e.g. \".py .ts\"). Passed to `batho index --extensions`."
    required: false
    default: ""
  output-dir:
    description: "Directory (relative to `root`) where Batho writes artifacts."
    required: false
    default: ".ctn"
  artifact-name:
    description: "Name of the uploaded workflow artifact."
    required: false
    default: "batho-index"
  artifact-retention-days:
    description: "How long (in days) to retain the uploaded artifact."
    required: false
    default: "7"
  upload-artifact:
    description: "Whether to upload the output directory as a workflow artifact (\"true\" or \"false\")."
    required: false
    default: "true"
  summary:
    description: "Whether to write a GitHub Step Summary (\"true\" or \"false\")."
    required: false
    default: "true"
  extra-args:
    description: "Extra arguments appended to `batho index` (advanced)."
    required: false
    default: ""

outputs:
  index-id:
    description: "The Batho index id produced by this run (read from .ctn/index.json)."
    value: ${{ steps.run-batho.outputs.index-id }}
  output-dir:
    description: "Absolute path to the Batho output directory."
    value: ${{ steps.run-batho.outputs.output-dir }}

runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v4

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install "${{ inputs.python-version }}"

    - name: Install Batho
      shell: bash
      env:
        BATHO_REF: ${{ inputs.batho-ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Create an isolated venv under the runner temp so we don't touch the consumer's project env.
        export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/batho-venv"
        uv venv --python "${{ inputs.python-version }}" "${UV_PROJECT_ENVIRONMENT}"
        if [ -z "${BATHO_REF}" ]; then
          echo "Installing Batho from action checkout: ${ACTION_PATH}/.."
          uv pip install --python "${UV_PROJECT_ENVIRONMENT}" "${ACTION_PATH}/.."
        else
          echo "Installing Batho from git ref: ${BATHO_REF}"
          uv pip install --python "${UV_PROJECT_ENVIRONMENT}" "git+https://github.com/sageoz/batho@${BATHO_REF}"
        fi
        # Expose the venv for later steps.
        echo "UV_PROJECT_ENVIRONMENT=${UV_PROJECT_ENVIRONMENT}" >> "${GITHUB_ENV}"
        echo "${UV_PROJECT_ENVIRONMENT}/bin" >> "${GITHUB_PATH}"

    - name: Run batho index
      id: run-batho
      shell: bash
      env:
        BATHO_ROOT: ${{ inputs.root }}
        BATHO_EXTENSIONS: ${{ inputs.extensions }}
        BATHO_EXTRA_ARGS: ${{ inputs.extra-args }}
        BATHO_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        ROOT_ABS="$(cd "${GITHUB_WORKSPACE}/${BATHO_ROOT}" && pwd)"
        echo "Indexing repo: ${ROOT_ABS}"
        CMD=(batho index --root "${ROOT_ABS}")
        if [ -n "${BATHO_EXTENSIONS}" ]; then
          # shellcheck disable=SC2206
          EXT_ARR=(${BATHO_EXTENSIONS})
          CMD+=(--extensions "${EXT_ARR[@]}")
        fi
        if [ -n "${BATHO_EXTRA_ARGS}" ]; then
          # shellcheck disable=SC2206
          EXTRA_ARR=(${BATHO_EXTRA_ARGS})
          CMD+=("${EXTRA_ARR[@]}")
        fi
        echo "+ ${CMD[*]}"
        "${CMD[@]}"

        OUT_DIR="${ROOT_ABS}/${BATHO_OUTPUT_DIR}"
        echo "output-dir=${OUT_DIR}" >> "${GITHUB_OUTPUT}"

        INDEX_JSON="${OUT_DIR}/index.json"
        INDEX_ID=""
        if [ -f "${INDEX_JSON}" ]; then
          INDEX_ID="$(python -c "import json,sys; d=json.load(open(sys.argv[1])); print(d.get('current_index_id') or '')" "${INDEX_JSON}")"
        fi
        echo "index-id=${INDEX_ID}" >> "${GITHUB_OUTPUT}"

    - name: Write Step Summary
      if: ${{ inputs.summary == 'true' }}
      shell: bash
      env:
        OUT_DIR: ${{ steps.run-batho.outputs.output-dir }}
        INDEX_ID: ${{ steps.run-batho.outputs.index-id }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python "${ACTION_PATH}/../scripts/ci/render_summary.py" \
          --output-dir "${OUT_DIR}" \
          --index-id "${INDEX_ID}" \
          --summary-file "${GITHUB_STEP_SUMMARY}"

    - name: Upload Batho artifacts
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run-batho.outputs.output-dir }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: warn
