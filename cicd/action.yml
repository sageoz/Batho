name: "Batho Index"
description: "Run Batho to index a repository and upload the transport ZIP package as a workflow artifact."
author: "Batho"
branding:
  icon: "layers"
  color: "purple"

inputs:
  root:
    description: "Path to the repo root to index (relative to GITHUB_WORKSPACE)."
    required: false
    default: "."
  python-version:
    description: "Python version to install via uv."
    required: false
    default: "3.12"
  batho-ref:
    description: |
      How to install Batho.
        - "" (default): install from this action's checkout (${GITHUB_ACTION_PATH}).
        - a git ref (e.g. "main", "v1.1.0", or a commit sha): install via "git+https://github.com/sageoz/batho@<ref>".
        - "pypi": install the latest published version from PyPI via "pip install batho".
    required: false
    default: ""
  verbose:
    description: "Whether to run Batho in verbose/debug mode (\"true\" or \"false\")."
    required: false
    default: "false"
  max-workers:
    description: "Max parallel workers for parsing (default: CPU count)."
    required: false
    default: ""
  max-file-size-kb:
    description: "Skip files exceeding this size in kilobytes."
    required: false
    default: ""
  artifact-name:
    description: "Name of the uploaded workflow artifact."
    required: false
    default: "batho-index"
  artifact-retention-days:
    description: "How long (in days) to retain the uploaded artifact."
    required: false
    default: "7"
  upload-artifact:
    description: "Whether to upload the output ZIP as a workflow artifact (\"true\" or \"false\")."
    required: false
    default: "true"
  summary:
    description: "Whether to write a GitHub Step Summary (\"true\" or \"false\")."
    required: false
    default: "true"

outputs:
  zip-path:
    description: "Absolute path to the produced .batho ZIP package."
    value: ${{ steps.run-batho.outputs.zip-path }}
  output-dir:
    description: "Absolute path to the directory containing the ZIP package."
    value: ${{ steps.run-batho.outputs.output-dir }}
  index-id:
    description: "The Batho index run ID produced by this build."
    value: ${{ steps.run-batho.outputs.index-id }}

runs:
  using: "composite"
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v4

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install "${{ inputs.python-version }}"

    - name: Install Batho
      shell: bash
      env:
        BATHO_REF: ${{ inputs.batho-ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Create an isolated venv under the runner temp so we don't touch the consumer's project env.
        export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/batho-venv"
        uv venv --python "${{ inputs.python-version }}" "${UV_PROJECT_ENVIRONMENT}"
        if [ -z "${BATHO_REF}" ]; then
          if [ -f "${ACTION_PATH}/pyproject.toml" ]; then
            INSTALL_PATH="${ACTION_PATH}"
          elif [ -f "${ACTION_PATH}/../pyproject.toml" ]; then
            INSTALL_PATH="${ACTION_PATH}/.."
          else
            echo "ERROR: Could not find pyproject.toml relative to ACTION_PATH: ${ACTION_PATH}"
            exit 1
          fi
          echo "Installing Batho from local path: ${INSTALL_PATH}"
          uv pip install --python "${UV_PROJECT_ENVIRONMENT}" "${INSTALL_PATH}"
        else
          echo "Installing Batho from git ref: ${BATHO_REF}"
          uv pip install --python "${UV_PROJECT_ENVIRONMENT}" "git+https://github.com/sageoz/batho@${BATHO_REF}"
        fi
        # Expose the venv for later steps.
        echo "UV_PROJECT_ENVIRONMENT=${UV_PROJECT_ENVIRONMENT}" >> "${GITHUB_ENV}"
        echo "${UV_PROJECT_ENVIRONMENT}/bin" >> "${GITHUB_PATH}"

    - name: Run batho build & export
      id: run-batho
      shell: bash
      env:
        BATHO_ROOT: ${{ inputs.root }}
        BATHO_VERBOSE: ${{ inputs.verbose }}
        BATHO_MAX_WORKERS: ${{ inputs.max-workers }}
        BATHO_MAX_FILE_SIZE_KB: ${{ inputs.max-file-size-kb }}
      run: |
        set -euo pipefail
        ROOT_ABS="$(cd "${GITHUB_WORKSPACE}/${BATHO_ROOT}" && pwd)"
        echo "Building index: ${ROOT_ABS}"
        
        CMD=(batho build --root "${ROOT_ABS}" --full)
        if [ "${BATHO_VERBOSE}" = "true" ]; then
          CMD+=(--verbose)
        fi
        if [ -n "${BATHO_MAX_WORKERS}" ]; then
          CMD+=(--max-workers "${BATHO_MAX_WORKERS}")
        fi
        if [ -n "${BATHO_MAX_FILE_SIZE_KB}" ]; then
          CMD+=(--max-file-size-kb "${BATHO_MAX_FILE_SIZE_KB}")
        fi
        echo "+ ${CMD[*]}"
        "${CMD[@]}"

        echo "Exporting transport package..."
        EXPORT_CMD=(batho export --root "${ROOT_ABS}")
        if [ "${BATHO_VERBOSE}" = "true" ]; then
          EXPORT_CMD+=(--verbose)
        fi
        echo "+ ${EXPORT_CMD[*]}"
        
        EXPORT_OUTPUT=$("${EXPORT_CMD[@]}" 2>&1)
        echo "${EXPORT_OUTPUT}"
        
        # Parse output file path from output which prints "Packed → /path/to/artifact_<dir>.batho"
        ZIP_PATH=$(echo "${EXPORT_OUTPUT}" | grep -oE "Packed → .*" | head -n 1 | sed 's/Packed → //' | xargs)
        if [ -z "${ZIP_PATH}" ]; then
          # Fallback: construct default location
          ROOT_NAME="$(basename "${ROOT_ABS}")"
          SANITIZED=$(echo "${ROOT_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]/-/g' | sed -E 's/^-+|-+$//g')
          ZIP_PATH="${ROOT_ABS}/artifact_${SANITIZED}.batho"
        fi
        
        # Extract last run uuid from meta.json
        META_JSON="${ROOT_ABS}/.batho/artifact/meta.json"
        INDEX_ID=""
        if [ -f "${META_JSON}" ]; then
          INDEX_ID=$(python -c "import json; print(json.load(open('${META_JSON}'))['last_run_uuid'])" | xargs)
        fi
        
        echo "zip-path=${ZIP_PATH}" >> "${GITHUB_OUTPUT}"
        echo "output-dir=$(dirname "${ZIP_PATH}")" >> "${GITHUB_OUTPUT}"
        echo "index-id=${INDEX_ID}" >> "${GITHUB_OUTPUT}"

    - name: Write Step Summary
      if: ${{ inputs.summary == 'true' }}
      shell: bash
      env:
        ROOT_ABS: ${{ inputs.root }}
        ZIP_PATH: ${{ steps.run-batho.outputs.zip-path }}
      run: |
        set -euo pipefail
        ROOT_ABS_PATH="$(cd "${GITHUB_WORKSPACE}/${ROOT_ABS}" && pwd)"
        
        echo "Generating Step Summary..."
        batho export --root "${ROOT_ABS_PATH}" --view overview --output "${RUNNER_TEMP}/overview.json"
        
        python -c '
        import json, os, sys
        summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
        if not summary_file:
            sys.exit(0)
        try:
            with open(sys.argv[1]) as f:
                data = json.load(f)
            
            summary = data.get("summary", {})
            total_files = summary.get("total_files", 0)
            total_entities = summary.get("total_entities", 0)
            total_relationships = summary.get("total_relationships", 0)
            
            repo_name = data.get("repo", "Repository")
            zip_name = os.path.basename(sys.argv[2])
            zip_size = os.path.getsize(sys.argv[2])
            
            def human_bytes(n):
                for unit in ("B", "KiB", "MiB", "GiB"):
                    if n < 1024:
                        return f"{n:.1f} {unit}" if unit != "B" else f"{int(n)} {unit}"
                    n /= 1024
                return f"{n:.1f} GiB"

            md = (
                f"## Batho Index Summary for `{repo_name}`\n\n"
                f"| Metric | Value |\n"
                f"| --- | --- |\n"
                f"| **Files indexed** | {total_files} |\n"
                f"| **Entities extracted** | {total_entities} |\n"
                f"| **Relationships** | {total_relationships} |\n"
                f"| **Transport ZIP** | `{zip_name}` |\n"
                f"| **ZIP Size** | {human_bytes(zip_size)} |\n\n"
                f"_Index build succeeded. Transport package is ready for upload._\n"
            )
            with open(summary_file, "a") as f_out:
                f_out.write(md)
        except Exception as e:
            print(f"Error rendering summary: {e}", file=sys.stderr)
        ' "${RUNNER_TEMP}/overview.json" "${ZIP_PATH}"

    - name: Upload Batho artifacts
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run-batho.outputs.zip-path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: warn
