name: Batho Index (reusable)

# Reusable workflow that wraps the Batho composite action.
# Call from a consumer repo with:
#
#   jobs:
#     batho:
#       uses: sageoz/batho/.github/workflows/batho-index.yml@v1.1.0
#       with:
#         root: "."
#

on:
  workflow_call:
    inputs:
      root:
        description: "Path to the repo root to index."
        required: false
        type: string
        default: "."
      python-version:
        description: "Python version to install."
        required: false
        type: string
        default: "3.12"
      batho-ref:
        description: "Git ref of Batho to install, or empty to use the action's checkout."
        required: false
        type: string
        default: ""
      verbose:
        description: "Whether to run Batho in verbose mode (\"true\" or \"false\")."
        required: false
        type: string
        default: "false"
      max-workers:
        description: "Max parallel workers for parsing."
        required: false
        type: string
        default: ""
      max-file-size-kb:
        description: "Skip files exceeding this size in kilobytes."
        required: false
        type: string
        default: ""
      artifact-name:
        description: "Name of the uploaded workflow artifact."
        required: false
        type: string
        default: "batho-index"
      artifact-retention-days:
        description: "How long to retain the uploaded artifact (days)."
        required: false
        type: string
        default: "7"
      upload-artifact:
        description: "Upload the output ZIP as a workflow artifact."
        required: false
        type: string
        default: "true"
      summary:
        description: "Write a GitHub Step Summary."
        required: false
        type: string
        default: "true"
      runs-on:
        description: "Runner label for the job."
        required: false
        type: string
        default: "ubuntu-latest"

    outputs:
      zip-path:
        description: "Absolute path to the produced .batho ZIP package."
        value: ${{ jobs.batho-index.outputs.zip-path }}
      output-dir:
        description: "Absolute path to the directory containing the ZIP package."
        value: ${{ jobs.batho-index.outputs.output-dir }}
      index-id:
        description: "Batho index run ID produced by this build."
        value: ${{ jobs.batho-index.outputs.index-id }}

permissions:
  contents: read

jobs:
  batho-index:
    name: Batho Index
    runs-on: ${{ inputs.runs-on }}
    outputs:
      zip-path: ${{ steps.batho.outputs.zip-path }}
      output-dir: ${{ steps.batho.outputs.output-dir }}
      index-id: ${{ steps.batho.outputs.index-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Batho
        id: batho
        uses: sageoz/batho@v1.1.0
        with:
          root: ${{ inputs.root }}
          python-version: ${{ inputs.python-version }}
          batho-ref: ${{ inputs.batho-ref }}
          verbose: ${{ inputs.verbose }}
          max-workers: ${{ inputs.max-workers }}
          max-file-size-kb: ${{ inputs.max-file-size-kb }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
          upload-artifact: ${{ inputs.upload-artifact }}
          summary: ${{ inputs.summary }}
