schema_version: bsg-plugin.v2
plugin_id: bsg_schema_migration_enforcer
name: Schema Migration Enforcer
version: 1.0.0
enabled: true
description: Ensure ORM and schema changes are treated as migration-sensitive operations.
rules:
  - rule_id: orm-schema-migration-risk
    name: orm-schema-migration-risk
    description: Flag modified schema/orm entities that require migration companion changes.
    severity: block
    priority: 330
    enabled: true
    matchers:
      usn_tags_any:
        - orm_model
        - databaseschema
    actions:
      metadata:
        bsg.intercept.category: DATA
        bsg.intercept.message: Database structure changed; ensure migration artifacts are generated and reviewed.
      add_usn_tags:
        - MigrationSensitive
  - rule_id: schema-migration-content
    name: schema-migration-content
    description: Detect schema/ORM/SQL patterns via file content matching.
    severity: block
    priority: 329
    enabled: true
    matchers:
      entity_types:
        - function
        - method
        - entry_point
        - class
      content_patterns:
        - 'CREATE TABLE'
        - 'ALTER TABLE'
        - 'DROP TABLE'
        - 'ADD COLUMN'
        - 'class Model'
        - 'models.Model'
        - 'models.'
        - 'schema'
        - 'migration'
        - 'SELECT'
        - 'INSERT INTO'
        - 'UPDATE'
        - 'DELETE FROM'
    actions:
      metadata:
        bsg.intercept.category: DATA
        bsg.intercept.message: Database schema/ORM pattern detected via file content; ensure migration artifacts are generated and reviewed.
      add_usn_tags:
        - MigrationSensitive
