# Default ignore patterns for Batho indexing
# These patterns are applied in addition to .gitignore
# Only includes external modules, libraries, and build artifacts
# Format: gitignore-style glob patterns
version: ignore-patterns.v1

patterns:
  # Git directory
  - ".git/"

  # Virtual environments
  - ".venv/"
  - "venv/"
  - "env/"
  - ".env/"
  - "virtualenv/"

  # Node.js dependencies
  - "node_modules/"
  - "bower_components/"

  # Python cache
  - "__pycache__/"
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - ".pytest_cache/"
  - ".mypy_cache/"
  - ".tox/"

  # Build artifacts
  - "build/"
  - "dist/"
  - "*.egg-info/"
  - ".eggs/"
  - "target/"
  - "out/"

  # IDE directories
  - ".idea/"
  - ".vscode/"
  - ".vs/"
  - "*.swp"
  - "*.swo"
  - "*~"

  # OS files
  - ".DS_Store"
  - "Thumbs.db"

  # Lock files
  - "uv.lock"
  - "pnpm-lock.yaml"
  - "package-lock.json"
  - "yarn.lock"
  - "bun.lockb"
  - "bun.lock"
  - "deno.lock"
  - "flake.lock"
  - "poetry.lock"
  - "pdm.lock"
  - "Cargo.lock"
  - "Gemfile.lock"
  - "composer.lock"
  - "packages.lock.json"
  - "Pipfile.lock"
  - "conda-lock.yml"

  # Generated build metadata, sourcemaps, and minified bundles
  - "*.tsbuildinfo"
  - "*.map"
  - "*.min.js"
  - "*.min.css"

  # Batho's own files and directories
  - "batho.yaml"
  - ".batho/"
  - "artifact_*.batho*"
  - ".aider/"
  - ".roo/"
  - ".cline/"
  - ".kilo/"
  - ".devin/"
  - ".windsurf/"
  - ".cursor/"
  - ".claude/"
  - ".codeium/"
  - ".specs/"

  # Framework build directories
  - ".next/"
  - ".nuxt/"
  - ".output/"

  # Coverage cache
  - "coverage/"
  - "htmlcov/"

  # Other tooling outputs (knowledge-graph / code-intel tools)
  - "graphify-out/"
  - ".graphify/"

