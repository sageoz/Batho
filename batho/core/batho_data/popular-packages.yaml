schema_version: 1
description: >
  Pre-indexed popular third-party packages per language/runtime for Batho CDEU.
  Used when dependency introspection is enabled but full_scan is disabled, to
  prioritize symbol indexing for the most widely used packages.
generated_at: "2026-05-30T19:44:00+05:30"
maintainer: "Batho CDEU"
source_notes:
  - "Python: Top PyPI packages by recent download count (30-day window)."
  - "npm: Most depended-upon npm packages."
  - "Rust/Go/Java: Curated from community 'most used' and 'blessed' crate/module lists."

defaults:
  # Global default when config doesn't override per language
  max_preindexed_packages: 200
  default_preindexed_packages: 100
  full_scan_default: false   # future: overridable via dependency config

languages:
  python:
    language_id: python
    display_name: "Python"
    package_manager: pip
    ecosystem: pypi
    limits:
      max_preindexed_packages: 200
      default_preindexed_packages: 100
      full_scan_default: false
    symbol_indexing:
      default_strategy: live_introspection_with_stub_fallback
      live_introspection:
        enabled: true
        requires_venv: true      # requires .venv or active env
        depth: shallow           # shallow by default; deep can be config-driven
        timeout_seconds: 5
      type_stubs:
        enabled: true
        sources:
          - typeshed
          - pyright
    packages:
      # Seeded from recent Top PyPI downloads (30-day window).
      # Ordered by popularity; ranks are within this list, not global guarantees.
      - name: boto3
        manager: pip
        rank: 1
        selection_source: "top-pypi-packages 30d"
        source_url: "https://hugovk.dev/top-pypi-packages/top-pypi-packages.csv"
