  javascript:
    language_id: javascript
    display_name: "JavaScript / Node.js"
    package_manager: npm
    ecosystem: npm
    limits:
      max_preindexed_packages: 200
      default_preindexed_packages: 100
      full_scan_default: false
    symbol_indexing:
      default_strategy: bundled_tables_with_opt_in_full_scan
      bundled_tables:
        enabled: true
        coverage: "top-200"
        notes: >
          Uses curated, hand-maintained symbol tables for most-used packages
          (React, Express, lodash, etc.) to avoid expensive node_modules scans.
      node_modules_scan:
        enabled: true
        depth: shallow
        timeout_seconds: 5
        notes: >
          Only enabled when per-language or global full_scan flag is true, to
          avoid pathological performance on large node_modules trees.
    packages:
      # Seeded from "most depended-upon" npm list.
      - name: lodash
