schema_version: bsg-plugin.v2
plugin_id: bsg_detection_cpp
name: C/C++ Language Detection
version: 1.0.0
enabled: true
description: Detect C/C++ projects from build files and source files.
rules:
  - rule_id: detect-cpp
    name: C/C++ Language Detection
    description: Detect C/C++ projects from source files and build systems.
    severity: info
    priority: 42
    enabled: true
    matchers:
      file_patterns:
        - '**/*.cpp'
        - '**/*.hpp'
        - '**/*.h'
        - '**/*.cc'
        - '**/*.cxx'
        - '**/*.hxx'
        - '**/*.c'
        - '**/CMakeLists.txt'
        - '**/Makefile'
        - '**/configure.ac'
      content_patterns:
        - '#include'
        - 'std::'
        - 'cout'
        - 'cin'
    actions:
      detect_language:
        language: C++

  - rule_id: detect-cmake
    name: CMake Build System Detection
    description: Detect CMake build system from CMakeLists.txt.
    severity: info
    priority: 41
    enabled: true
    matchers:
      file_patterns:
        - '**/CMakeLists.txt'
    actions:
      detect_package_manager:
        package_manager: cmake

  - rule_id: detect-conan
    name: Conan Package Manager Detection
    description: Detect Conan package manager from conanfile.
    severity: info
    priority: 40
    enabled: true
    matchers:
      file_patterns:
        - '**/conanfile.txt'
        - '**/conanfile.py'
    actions:
      detect_package_manager:
        package_manager: conan

  - rule_id: detect-vcpkg
    name: vcpkg Package Manager Detection
    description: Detect vcpkg package manager from vcpkg.json.
    severity: info
    priority: 39
    enabled: true
    matchers:
      file_patterns:
        - '**/vcpkg.json'
        - '**/.vcpkg-configuration.json'
    actions:
      detect_package_manager:
        package_manager: vcpkg

  - rule_id: detect-qt
    name: Qt Framework Detection
    description: Detect Qt framework from .pro files and includes.
    severity: info
    priority: 38
    enabled: true
    matchers:
      file_patterns:
        - '**/*.pro'
        - '**/*.pri'
      content_patterns:
        - 'QT +='
        - '#include <Q'
    actions:
      detect_framework:
        language: C++
        framework: Qt

  - rule_id: detect-boost
    name: Boost Library Detection
    description: Detect Boost library usage from includes.
    severity: info
    priority: 37
    enabled: true
    matchers:
      file_patterns:
        - '**/*.cpp'
        - '**/*.hpp'
      content_patterns:
        - '#include <boost/'
        - 'boost::'
    actions:
      detect_framework:
        language: C++
        framework: Boost
