schema_version: bsg-plugin.v1
plugin_id: bsg_file_categorization
name: BSG File Categorization
version: 1.0.0
enabled: true
description: Categorize files into TEST, DOCS, CONFIG, SOURCE based on path patterns and extensions.

rules:
  # Priority 400: TEST category (highest priority)
  - rule_id: category-test-path
    name: Test Files by Path
    description: Detect test files by path patterns (tests/, test/, __tests__, spec/, specs/)
    severity: info
    priority: 400
    enabled: true
    matchers:
      file_patterns:
        - '**/tests/**'
        - '**/test/**'
        - '**/__tests__/**'
        - '**/spec/**'
        - '**/specs/**'
        - '**/.pytest_cache/**'
        - '**/__pycache__/**'
    actions:
      assign_category:
        category: TEST

  - rule_id: category-test-prefix
    name: Test Files by Prefix
    description: Detect test files by test_ prefix
    severity: info
    priority: 390
    enabled: true
    matchers:
      file_patterns:
        - '**/test_*'
    actions:
      assign_category:
        category: TEST

  - rule_id: category-test-suffix
    name: Test Files by Suffix
    description: Detect test files by _test or .test or .spec suffixes
    severity: info
    priority: 380
    enabled: true
    matchers:
      file_patterns:
        - '**/*_test.py'
        - '**/*_test.js'
        - '**/*_test.ts'
        - '**/*_test.jsx'
        - '**/*_test.tsx'
        - '**/*.test.py'
        - '**/*.test.js'
        - '**/*.test.ts'
        - '**/*.test.jsx'
        - '**/*.test.tsx'
        - '**/*.spec.py'
        - '**/*.spec.js'
        - '**/*.spec.ts'
        - '**/*.spec.jsx'
        - '**/*.spec.tsx'
        - '**/*_spec.py'
        - '**/*_spec.js'
        - '**/*_spec.ts'
        - '**/*_spec.jsx'
        - '**/*_spec.tsx'
        - '**/*Test.java'
        - '**/*Test.kt'
        - '**/*Test.scala'
        - '**/*Test.go'
        - '**/*Spec.scala'
        - '**/*Spec.rb'
        - '**/*_test.go'
        - '**/*_test.rs'
    actions:
      assign_category:
        category: TEST

  # Priority 300: DOCS category
  - rule_id: category-docs-path
    name: Documentation Files by Path
    description: Detect documentation files by path patterns (docs/, doc/, documentation/, wiki/, guides/, examples/)
    severity: info
    priority: 300
    enabled: true
    matchers:
      file_patterns:
        - '**/docs/**'
        - '**/doc/**'
        - '**/documentation/**'
        - '**/wiki/**'
        - '**/guides/**'
        - '**/examples/**'
    actions:
      assign_category:
        category: DOCS

  - rule_id: category-docs-extension
    name: Documentation Files by Extension
    description: Detect documentation files by extensions (.md, .markdown, .rst, .txt, .adoc, .org, .asciidoc)
    severity: info
    priority: 290
    enabled: true
    matchers:
      file_patterns:
        - '**/*.md'
        - '**/*.markdown'
        - '**/*.rst'
        - '**/*.txt'
        - '**/*.adoc'
        - '**/*.org'
        - '**/*.asciidoc'
    actions:
      assign_category:
        category: DOCS

  - rule_id: category-docs-special
    name: Special Documentation Files
    description: Detect special documentation files (README, CHANGELOG, LICENSE, etc.)
    severity: info
    priority: 280
    enabled: true
    matchers:
      file_patterns:
        - '**/README*'
        - '**/CHANGELOG*'
        - '**/CONTRIBUTING*'
        - '**/LICENSE*'
        - '**/COPYING*'
        - '**/CODE_OF_CONDUCT*'
        - '**/SECURITY*'
        - '**/AUTHORS*'
        - '**/CONTRIBUTORS*'
        - '**/HISTORY*'
        - '**/NEWS*'
        - '**/NOTICE*'
        - '**/PATENTS*'
        - '**/THANKS*'
        - '**/TODO*'
    actions:
      assign_category:
        category: DOCS

  # Priority 200: CONFIG category
  - rule_id: category-config-path
    name: Configuration Files by Path
    description: Detect configuration files by path patterns (config/, .github/, .gitlab/, ci/, build/, etc.)
    severity: info
    priority: 200
    enabled: true
    matchers:
      file_patterns:
        - '**/config/**'
        - '**/configs/**'
        - '**/configuration/**'
        - '**/.github/**'
        - '**/.gitlab/**'
        - '**/ci/**'
        - '**/build/**'
        - '**/.circleci/**'
        - '**/.travis/**'
        - '**/jenkins/**'
    actions:
      assign_category:
        category: CONFIG

  - rule_id: category-config-exact
    name: Configuration Files by Exact Name
    description: Detect configuration files by exact filename matches
    severity: info
    priority: 190
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
        - '**/package-lock.json'
        - '**/yarn.lock'
        - '**/pnpm-lock.yaml'
        - '**/pyproject.toml'
        - '**/setup.py'
        - '**/setup.cfg'
        - '**/requirements.txt'
        - '**/Pipfile'
        - '**/Pipfile.lock'
        - '**/poetry.lock'
        - '**/Cargo.toml'
        - '**/Cargo.lock'
        - '**/go.mod'
        - '**/go.sum'
        - '**/build.gradle'
        - '**/pom.xml'
        - '**/composer.json'
        - '**/Gemfile'
        - '**/Gemfile.lock'
        - '**/Makefile'
        - '**/CMakeLists.txt'
        - '**/Dockerfile*'
        - '**/docker-compose.yml'
        - '**/docker-compose.yaml'
        - '**/.dockerignore'
        - '**/.gitignore'
        - '**/.gitattributes'
        - '**/.editorconfig'
        - '**/.eslintrc*'
        - '**/.prettierrc*'
        - '**/.babelrc*'
        - '**/.npmrc'
        - '**/.yarnrc'
        - '**/tsconfig.json'
        - '**/jsconfig.json'
        - '**/webpack.config.js'
        - '**/rollup.config.js'
        - '**/vite.config.js'
        - '**/jest.config.js'
        - '**/karma.conf.js'
        - '**/protractor.conf.js'
        - '**/tslint.json'
        - '**/.pylintrc'
        - '**/.flake8'
        - '**/mypy.ini'
        - '**/pytest.ini'
        - '**/tox.ini'
        - '**/.pre-commit-config.yaml'
        - '**/renovate.json'
        - '**/dependabot.yml'
    actions:
      assign_category:
        category: CONFIG

  - rule_id: category-config-suffix
    name: Configuration Files by Suffix
    description: Detect configuration files by suffixes (.config.js, .config.ts, rc.js, etc.)
    severity: info
    priority: 180
    enabled: true
    matchers:
      file_patterns:
        - '**/*.config.js'
        - '**/*.config.ts'
        - '**/*.config.mjs'
        - '**/*.config.cjs'
        - '**/*.config.json'
        - '**/*.config.yaml'
        - '**/*.config.yml'
        - '**/*rc.js'
        - '**/*rc.json'
        - '**/*rc.yaml'
        - '**/*rc.yml'
    actions:
      assign_category:
        category: CONFIG

  # Priority 100: SOURCE category
  - rule_id: category-source-extension
    name: Source Code Files by Extension
    description: Detect source code files by programming language extensions
    severity: info
    priority: 100
    enabled: true
    matchers:
      file_patterns:
        - '**/*.py'
        - '**/*.js'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.jsx'
        - '**/*.mjs'
        - '**/*.cjs'
        - '**/*.go'
        - '**/*.rs'
        - '**/*.java'
        - '**/*.rb'
        - '**/*.php'
        - '**/*.cs'
        - '**/*.kt'
        - '**/*.kts'
        - '**/*.swift'
        - '**/*.scala'
        - '**/*.dart'
        - '**/*.hs'
        - '**/*.jl'
        - '**/*.erl'
        - '**/*.ml'
        - '**/*.lua'
        - '**/*.r'
        - '**/*.pl'
        - '**/*.v'
        - '**/*.zig'
        - '**/*.sh'
        - '**/*.bash'
        - '**/*.zsh'
        - '**/*.m'
        - '**/*.mm'
        - '**/*.c'
        - '**/*.cc'
        - '**/*.cpp'
        - '**/*.h'
        - '**/*.hpp'
        - '**/*.hh'
        - '**/*.hxx'
        - '**/*.ps1'
        - '**/*.bat'
        - '**/*.clj'
        - '**/*.cljs'
        - '**/*.ex'
        - '**/*.exs'
        - '**/*.elm'
        - '**/*.fs'
        - '**/*.fsx'
        - '**/*.vb'
        - '**/*.groovy'
        - '**/*.nim'
        - '**/*.cr'
        - '**/*.d'
    actions:
      assign_category:
        category: SOURCE
