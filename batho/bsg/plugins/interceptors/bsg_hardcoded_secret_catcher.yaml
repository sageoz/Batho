schema_version: bsg-plugin.v1
plugin_id: bsg_hardcoded_secret_catcher
name: Hardcoded Secret Catcher
version: 1.0.0
enabled: true
description: Flag likely hardcoded secret-bearing symbols in code.
rules:
  - rule_id: likely-hardcoded-secret
    name: likely-hardcoded-secret
    description: Detect variable/constant names that commonly hold secrets.
    severity: block
    priority: 350
    enabled: true
    matchers:
      entity_types:
        - variable
        - constant
        - field
      name_patterns:
        - '*secret*'
        - '*token*'
        - '*apikey*'
        - '*api_key*'
        - '*password*'
    actions:
      metadata:
        bsg.intercept.category: SECURITY
        bsg.intercept.message: Potential hardcoded secret pattern detected; move to secure env/secret storage.
      add_usn_tags:
        - SecretCandidate
