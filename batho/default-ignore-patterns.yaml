# Default ignore patterns for Batho indexing
# These patterns are applied in addition to .gitignore
# Only includes external modules, libraries, and build artifacts
# Format: gitignore-style glob patterns
version: ignore-patterns.v1

patterns:
  # Git directory
  - ".git/"

  # Virtual environments
  - ".venv/"
  - "venv/"
  - "env/"
  - ".env/"
  - "virtualenv/"

  # Node.js dependencies
  - "node_modules/"
  - "bower_components/"

  # Python cache
  - "__pycache__/"
  - "*.pyc"
  - "*.pyo"
  - "*.pyd"
  - ".pytest_cache/"
  - ".mypy_cache/"
  - ".tox/"

  # Build artifacts
  - "build/"
  - "dist/"
  - "*.egg-info/"
  - ".eggs/"
  - "target/"
  - "out/"

  # IDE directories
  - ".idea/"
  - ".vscode/"
  - ".vs/"
  - "*.swp"
  - "*.swo"
  - "*~"

  # OS files
  - ".DS_Store"
  - "Thumbs.db"

  # Lock files
  - "uv.lock"
  - "package-lock.json"
  - "yarn.lock"
  - "poetry.lock"
  - "Cargo.lock"
  - "Gemfile.lock"

  # Batho's own directories
  - ".ctn/"
  - ".batho/"
  - ".aider/"
  - ".roo/"
  - ".cline/"
  - ".kilo/"

  # Framework build directories
  - ".next/"
  - ".nuxt/"
  - ".output/"

  # Coverage cache
  - "coverage/"
  - "htmlcov/"

