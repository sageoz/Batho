# Python-specific C4 Generation Rules

language: "python"
description: "Rules for Python applications including web frameworks, ORMs, and common libraries"
file_extensions: [".py"]

# Python-specific external system rules
external_systems:
  - name: "Python Database Detection"
    description: "Detect Python-specific database systems and ORMs"
    priority: 110
    patterns:
      # Python ORMs
      - "sqlalchemy"
      - "django.db"
      - "psycopg2"
      - "psycopg"
      - "asyncpg"
      - "aiosqlite"
      - "sqlite3"
      - "pymongo"
      - "motor"  # Async MongoDB
      - "redis"
      - "aioredis"
      - "aredis"
      # Python-specific ORMs
      - "tortoise"
      - "peewee"
      - "pony"
      - "sqlmodel"
      - "prisma"
      - "databases"
      # Database drivers
      - "pymysql"
      - "mysqlclient"
      - "mysql-connector-python"
      - "psycopg2-binary"
      - "cx_oracle"
    system_type: "Database"
    actor_name: "Database"
    actor_description: "Python database system"

  - name: "Python Web Framework Detection"
    description: "Detect Python web framework usage"
    priority: 105
    patterns:
      # Web Frameworks
      - "flask"
      - "django"
      - "fastapi"
      - "starlette"
      - "tornado"
      - "pyramid"
      - "sanic"
      - "aiohttp"
      - "quart"
      - "masonite"
      # WSGI servers
      - "gunicorn"
      - "uwsgi"
      - "mod_wsgi"
      # ASGI servers
      - "uvicorn"
      - "daphne"
      - "hypercorn"
    system_type: "WebServer"
    actor_name: "Web Server"
    actor_description: "Python web application server"

  - name: "Python Task Queue Detection"
    description: "Detect Python task queue and background job systems"
    priority: 108
    patterns:
      # Task Queues
      - "celery"
      - "rq"  # Redis Queue
      - "dramatiq"
      - "huey"
      - "arq"  # Async Redis Queue
      - "taskiq"
      # Scheduling
      - "apscheduler"
      - "celerybeat"
      - "schedule"
    system_type: "MessageQueue"
    actor_name: "Task Queue"
    actor_description: "Python background job processing system"

  - name: "Python Testing Framework Detection"
    description: "Detect Python testing frameworks and tools"
    priority: 95
    patterns:
      # Testing Frameworks
      - "pytest"
      - "unittest"
      - "nose"
      - "nose2"
      - "doctest"
      - "hypothesis"
      # Test runners
      - "tox"
      - "nox"
      # Mocking
      - "unittest.mock"
      - "pytest-mock"
      - "responses"
      - "vcrpy"
    system_type: "Testing"
    actor_name: "Test Framework"
    actor_description: "Python testing and automation framework"

  - name: "Python CLI Library Detection"
    description: "Detect Python CLI libraries"
    priority: 100
    patterns:
      # CLI Libraries
      - "click"
      - "typer"
      - "argparse"
      - "docopt"
      - "cement"
      - "cliff"
      - "plumbum"
    system_type: "CLI"
    actor_name: "CLI Framework"
    actor_description: "Python command-line interface framework"

  - name: "Python Async Library Detection"
    description: "Detect Python async/concurrency libraries"
    priority: 90
    patterns:
      # Async Libraries
      - "asyncio"
      - "trio"
      - "curio"
      - "anyio"
      # Async HTTP
      - "aiohttp"
      - "httpx"
      - "aiofiles"
      # Async Database
      - "asyncpg"
      - "aiomysql"
      - "aiosqlite"
      - "motor"
      - "aioredis"
    system_type: "AsyncFramework"
    actor_name: "Async Framework"
    actor_description: "Python async/concurrency framework"

  - name: "Python Data Science Detection"
    description: "Detect Python data science and ML libraries"
    priority: 85
    patterns:
      # Data Science
      - "pandas"
      - "numpy"
      - "scipy"
      - "matplotlib"
      - "seaborn"
      - "plotly"
      # Machine Learning
      - "scikit-learn"
      - "tensorflow"
      - "torch"
      - "keras"
      - "xgboost"
      # Jupyter
      - "jupyter"
      - "ipython"
      - "notebook"
    system_type: "DataScience"
    actor_name: "Data Science Platform"
    actor_description: "Python data science and ML platform"

# Python-specific container rules
containers:
  - name: "Python Web Application Container"
    description: "Detect Python web application containers"
    priority: 110
    framework_patterns:
      - "Flask"
      - "Django"
      - "FastAPI"
      - "Starlette"
      - "Tornado"
      - "Pyramid"
      - "Sanic"
      - "Aiohttp"
      - "Quart"
    directory_patterns:
      - "app"
      - "src"
      - "project"
      - "web"
      - "api"
    file_patterns:
      - "app.py"
      - "wsgi.py"
      - "asgi.py"
      - "manage.py"
      - "run.py"
      - "requirements.txt"
      - "Pipfile"
      - "pyproject.toml"
    container_type: "Web Application"
    container_name: "Python Web App"
    technology: ["Python", "WSGI", "ASGI"]

  - name: "Python API Service Container"
    description: "Detect Python API service containers"
    priority: 108
    framework_patterns:
      - "FastAPI"
      - "Starlette"
      - "Django REST Framework"
      - "Flask-RESTful"
      - "Aiohttp"
    directory_patterns:
      - "api"
      - "service"
      - "endpoint"
      - "rest"
    file_patterns:
      - "api.py"
      - "routes.py"
      - "endpoints.py"
      - "serializers.py"
      - "viewsets.py"
    container_type: "API Service"
    container_name: "Python API"
    technology: ["Python", "REST", "OpenAPI"]

  - name: "Python CLI Tool Container"
    description: "Detect Python CLI application containers"
    priority: 105
    framework_patterns:
      - "Click"
      - "Typer"
      - "Argparse"
      - "Docopt"
    directory_patterns:
      - "cli"
      - "cmd"
      - "scripts"
      - "bin"
    file_patterns:
      - "cli.py"
      - "main.py"
      - "command.py"
      - "setup.py"
      - "setup.cfg"
    container_type: "CLI Application"
    container_name: "Python CLI"
    technology: ["Python", "Command Line"]

  - name: "Python Background Worker Container"
    description: "Detect Python background worker containers"
    priority: 106
    framework_patterns:
      - "Celery"
      - "RQ"
      - "Dramatiq"
      - "Huey"
    directory_patterns:
      - "worker"
      - "tasks"
      - "jobs"
      - "background"
    file_patterns:
      - "tasks.py"
      - "worker.py"
      - "celery.py"
      - "rq.py"
      - "dramatiq.py"
    container_type: "Background Worker"
    container_name: "Python Worker"
    technology: ["Python", "Task Queue"]

  - name: "Python Data Processing Container"
    description: "Detect Python data processing containers"
    priority: 95
    framework_patterns:
      - "pandas"
      - "numpy"
      - "scipy"
      - "dask"
      - "luigi"
      - "apache-airflow"
      - "prefect"
    directory_patterns:
      - "data"
      - "etl"
      - "pipeline"
      - "processing"
      - "analytics"
    file_patterns:
      - "process.py"
      - "pipeline.py"
      - "etl.py"
      - "analytics.py"
      - "dags"  # Airflow
    container_type: "Data Processing"
    container_name: "Data Processor"
    technology: ["Python", "ETL", "Analytics"]

  - name: "Python ML Model Container"
    description: "Detect Python machine learning model containers"
    priority: 92
    framework_patterns:
      - "scikit-learn"
      - "tensorflow"
      - "torch"
      - "keras"
      - "xgboost"
      - "mlflow"
    directory_patterns:
      - "model"
      - "models"
      - "ml"
      - "training"
      - "inference"
    file_patterns:
      - "model.py"
      - "train.py"
      - "predict.py"
      - "inference.py"
    container_type: "ML Model"
    container_name: "ML Model"
    technology: ["Python", "Machine Learning"]

# Python-specific component rules
components:
  - name: "Python Django Components"
    description: "Identify Django-specific components"
    priority: 110
    entity_types: ["class", "function"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Django Component"
    name_patterns:
      - "*View"
      - "*Model"
      - "*Form"
      - "*Serializer"
      - "*Manager"
      - "*QuerySet"
      - "*Migration"
      - "*Admin"
    file_patterns:
      - "views.py"
      - "models.py"
      - "forms.py"
      - "serializers.py"
      - "admin.py"
      - "managers.py"
      - "migrations/"

  - name: "Python Flask Components"
    description: "Identify Flask-specific components"
    priority: 108
    entity_types: ["class", "function"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Flask Component"
    name_patterns:
      - "*Blueprint"
      - "*View"
      - "*Route"
      - "*Template"
      - "*Form"
    file_patterns:
      - "routes.py"
      - "views.py"
      - "forms.py"
      - "templates/"

  - name: "Python FastAPI Components"
    description: "Identify FastAPI-specific components"
    priority: 109
    entity_types: ["class", "function"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "FastAPI Component"
    name_patterns:
      - "*Router"
      - "*APIRouter"
      - "*Endpoint"
      - "*Dependency"
      - "*Middleware"
      - "*Exception"
    file_patterns:
      - "routes.py"
      - "routers.py"
      - "dependencies.py"
      - "middleware.py"
      - "exceptions.py"

  - name: "Python SQLAlchemy Components"
    description: "Identify SQLAlchemy-specific components"
    priority: 105
    entity_types: ["class", "function"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "SQLAlchemy Component"
    name_patterns:
      - "*Model"
      - "*Schema"
      - "*Repository"
      - "*Session"
      - "*Engine"
      - "*Migration"
    file_patterns:
      - "models.py"
      - "schema.py"
      - "repository.py"
      - "database.py"
      - "migrations/"

  - name: "Python Celery Components"
    description: "Identify Celery-specific components"
    priority: 103
    entity_types: ["function", "class"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Celery Task"
    name_patterns:
      - "*Task"
      - "*Job"
      - "*Worker"
      - "*Beat"
    file_patterns:
      - "tasks.py"
      - "workers.py"
      - "celery.py"
      - "beat_schedule.py"

  - name: "Python Pydantic Components"
    description: "Identify Pydantic model components"
    priority: 100
    entity_types: ["class", "function"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Pydantic Model"
    name_patterns:
      - "*Model"
      - "*Schema"
      - "*Settings"
      - "*Config"
      - "*Validator"
    file_patterns:
      - "models.py"
      - "schemas.py"
      - "settings.py"
      - "config.py"
      - "validators.py"

  - name: "Python Async Components"
    description: "Identify async/await components"
    priority: 95
    entity_types: ["function", "class", "method"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Async Component"
    name_patterns:
      - "async_*"
      - "await_*"
      - "*Async"
      - "*Coroutine"
    file_patterns:
      - "async_*.py"
      - "*_async.py"

  - name: "Python DataClass Components"
    description: "Identify Python dataclass components"
    priority: 90
    entity_types: ["class"]
    importance_threshold: 0.3
    max_per_file: 5
    component_type: "Data Class"
    name_patterns:
      - "*Config"
      - "*Settings"
      - "*Options"
      - "*Params"
      - "*Data"
    file_patterns:
      - "config.py"
      - "settings.py"
      - "dataclasses.py"
      - "types.py"
