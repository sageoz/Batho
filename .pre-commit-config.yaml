repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv
        args: [run, black, --target-version, py312]
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: uv
        args: [run, isort, --profile, black]
        language: system
        types: [python]
