[project]
name = "batho-core"
version = "0.1.0"
description = "Batho core indexing, repomap, and time-machine (no LLM)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=0.6.0",
    "pydantic>=2.10.0",
    "structlog>=25.1.0",
    "pathspec>=0.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
batho-core = "batho_core.cli:main"
