# Enhanced rules for cloud-native architecture detection

external_systems:
  # Container Platforms
  - name: "Kubernetes"
    description: "Kubernetes container orchestrator"
    priority: 100
    patterns: ["kubernetes", "k8s", "io.k8s"]
    system_type: "ContainerPlatform"
    actor_name: "Kubernetes"
    actor_description: "Container orchestration platform"
    
  - name: "Docker"
    description: "Docker container platform"
    priority: 95
    patterns: ["docker", "docker.io"]
    system_type: "ContainerPlatform"
    actor_name: "Docker"
    actor_description: "Container platform"
    
  - name: "Docker Compose"
    description: "Docker Compose orchestration"
    priority: 90
    patterns: ["docker-compose", "compose"]
    system_type: "ContainerPlatform"
    actor_name: "Docker Compose"
    actor_description: "Multi-container orchestration"
    
  # Cloud Providers
  - name: "Amazon Web Services"
    description: "AWS cloud platform"
    priority: 100
    patterns: ["aws", "amazon", "boto3", "aws-sdk"]
    system_type: "CloudPlatform"
    actor_name: "AWS"
    actor_description: "Amazon Web Services"
    
  - name: "Microsoft Azure"
    description: "Microsoft Azure cloud"
    priority: 95
    patterns: ["azure", "microsoft.azure", "azure-sdk"]
    system_type: "CloudPlatform"
    actor_name: "Azure"
    actor_description: "Microsoft Azure"
    
  - name: "Google Cloud Platform"
    description: "Google Cloud Platform"
    priority: 95
    patterns: ["gcp", "google.cloud", "google-cloud"]
    system_type: "CloudPlatform"
    actor_name: "GCP"
    actor_description: "Google Cloud Platform"
    
  # Serverless Platforms
  - name: "AWS Lambda"
    description: "AWS Lambda functions"
    priority: 100
    patterns: ["lambda", "aws-lambda", "boto3.lambda"]
    system_type: "ServerlessPlatform"
    actor_name: "AWS Lambda"
    actor_description: "Serverless compute service"
    
  - name: "Azure Functions"
    description: "Azure Functions"
    priority: 95
    patterns: ["azure-functions", "functions"]
    system_type: "ServerlessPlatform"
    actor_name: "Azure Functions"
    actor_description: "Serverless compute service"
    
  - name: "Google Cloud Functions"
    description: "Google Cloud Functions"
    priority: 90
    patterns: ["cloud-functions", "google.cloud.functions"]
    system_type: "ServerlessPlatform"
    actor_name: "Cloud Functions"
    actor_description: "Serverless compute service"
    
  # Infrastructure as Code
  - name: "Terraform"
    description: "Terraform IaC tool"
    priority: 95
    patterns: ["terraform", "hashicorp/terraform"]
    system_type: "IaCTool"
    actor_name: "Terraform"
    actor_description: "Infrastructure as Code tool"
    
  - name: "AWS CloudFormation"
    description: "AWS CloudFormation"
    priority: 90
    patterns: ["cloudformation", "aws-cfn"]
    system_type: "IaCTool"
    actor_name: "CloudFormation"
    actor_description: "AWS Infrastructure as Code"
    
  - name: "Pulumi"
    description: "Pulumi IaC platform"
    priority: 85
    patterns: ["pulumi", "@pulumi"]
    system_type: "IaCTool"
    actor_name: "Pulumi"
    actor_description: "Infrastructure as Code platform"
    
  - name: "Helm"
    description: "Helm package manager"
    priority: 90
    patterns: ["helm", "helm.sh"]
    system_type: "PackageManager"
    actor_name: "Helm"
    actor_description: "Kubernetes package manager"
    
  # Cloud Services
  - name: "Amazon S3"
    description: "Amazon S3 storage"
    priority: 100
    patterns: ["s3", "boto3.s3", "aws-sdk-s3"]
    system_type: "CloudStorage"
    actor_name: "Amazon S3"
    actor_description: "Object storage service"
    
  - name: "Azure Blob Storage"
    description: "Azure Blob Storage"
    priority: 95
    patterns: ["blob", "azure.storage.blob"]
    system_type: "CloudStorage"
    actor_name: "Azure Blob"
    actor_description: "Object storage service"
    
  - name: "Google Cloud Storage"
    description: "Google Cloud Storage"
    priority: 90
    patterns: ["gcs", "google.cloud.storage"]
    system_type: "CloudStorage"
    actor_name: "GCS"
    actor_description: "Object storage service"
    
  - name: "Amazon DynamoDB"
    description: "Amazon DynamoDB"
    priority: 95
    patterns: ["dynamodb", "boto3.dynamodb"]
    system_type: "CloudDatabase"
    actor_name: "DynamoDB"
    actor_description: "NoSQL database service"
    
  - name: "Azure Cosmos DB"
    description: "Azure Cosmos DB"
    priority: 90
    patterns: ["cosmos", "azure.cosmos"]
    system_type: "CloudDatabase"
    actor_name: "Cosmos DB"
    actor_description: "Multi-model database"
    
  - name: "Google Cloud SQL"
    description: "Google Cloud SQL"
    priority: 90
    patterns: ["cloudsql", "google.cloud.sql"]
    system_type: "CloudDatabase"
    actor_name: "Cloud SQL"
    actor_description: "Managed SQL database"

containers:
  # Cloud-Native Containers
  - name: "Kubernetes Deployment"
    description: "Kubernetes deployment container"
    priority: 95
    framework_patterns: ["kubernetes", "k8s"]
    directory_patterns: ["k8s", "kubernetes", "deploy"]
    file_patterns: ["deployment.yaml", "k8s/*.yaml", "helm/*"]
    container_type: "KubernetesDeployment"
    container_name: "K8s Deployment"
    technology = ["Kubernetes", "Docker", "YAML"]
    
  - name: "Serverless Function"
    description: "Serverless function container"
    priority: 90
    framework_patterns: ["lambda", "serverless", "functions"]
    directory_patterns: ["functions", "lambdas", "serverless"]
    file_patterns = ["*function*", "*handler*", "*.serverless"]
    container_type: "ServerlessFunction"
    container_name = "Serverless Function"
    technology = ["Serverless", "Cloud Functions", "Event-Driven"]
    
  - name: "Docker Container"
    description: "Docker containerized application"
    priority: 85
    framework_patterns: ["docker"]
    directory_patterns: ["docker", "containers"]
    file_patterns = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml"]
    container_type = "DockerContainer"
    container_name = "Docker Container"
    technology = ["Docker", "Containers", "Linux"]
    
  - name: "Helm Chart"
    description: "Helm chart package"
    priority: 90
    framework_patterns: ["helm"]
    directory_patterns: ["helm", "charts"]
    file_patterns = ["Chart.yaml", "values.yaml", "templates/*"]
    container_type = "HelmChart"
    container_name = "Helm Chart"
    technology = ["Kubernetes", "Helm", "Package Management"]

components:
  # Cloud-Native Components
  - name: "Kubernetes Controller"
    description: "Kubernetes controller"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type: "K8sController"
    name_patterns = ["*Controller", "*Operator", "*Reconciler"]
    
  - name: "Lambda Handler"
    description: "AWS Lambda handler"
    priority: 85
    entity_types: ["class", "function"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type = "LambdaHandler"
    name_patterns = ["*Handler", "*Lambda*", "*Function*"]
    
  - name: "Docker Entrypoint"
    description: "Docker container entrypoint"
    priority: 80
    entity_types: ["function", "class"]
    importance_threshold: 0.3
    max_per_file: 2
    component_type = "DockerEntrypoint"
    name_patterns = ["main", "entrypoint", "start"]
    
  - name: "Cloud Resource"
    description: "Cloud infrastructure resource"
    priority: 75
    entity_types: ["class"]
    importance_threshold: 0.3
    max_per_file: 5
    component_type = "CloudResource"
    name_patterns = ["*Resource", "*Stack", "*Infrastructure"]
