# Enhanced rules for microservice architecture detection

external_systems:
  # Service Discovery
  - name: "Consul Service Discovery"
    description: "HashiCorp Consul service discovery"
    priority: 100
    patterns: ["consul", "hashicorp/consul"]
    system_type: "ServiceDiscovery"
    actor_name: "Consul"
    actor_description: "Service discovery and configuration"
    
  - name: "Eureka Service Discovery"
    description: "Netflix Eureka service registry"
    priority: 100
    patterns: ["netflix.eureka", "spring-cloud-starter-netflix-eureka"]
    system_type: "ServiceDiscovery"
    actor_name: "Eureka"
    actor_description: "Service registry"
    
  - name: "etcd Service Discovery"
    description: "etcd distributed key-value store"
    priority: 95
    patterns: ["go.etcd.io/etcd", "coreos/etcd"]
    system_type: "ServiceDiscovery"
    actor_name: "etcd"
    actor_description: "Distributed key-value store"
    
  - name: "Zookeeper Service Discovery"
    description: "Apache Zookeeper coordination service"
    priority: 95
    patterns: ["org.apache.zookeeper", "zookeeper"]
    system_type: "ServiceDiscovery"
    actor_name: "Zookeeper"
    actor_description: "Distributed coordination service"
    
  # API Gateways
  - name: "Kong API Gateway"
    description: "Kong API gateway"
    priority: 100
    patterns: ["kong", "konghq"]
    system_type: "APIGateway"
    actor_name: "Kong"
    actor_description: "Cloud-native API gateway"
    
  - name: "Zuul API Gateway"
    description: "Netflix Zuul gateway"
    priority: 95
    patterns: ["netflix.zuul", "spring-cloud-starter-netflix-zuul"]
    system_type: "APIGateway"
    actor_name: "Zuul"
    actor_description: "API gateway and edge service"
    
  - name: "Ambassador API Gateway"
    description: "Ambassador edge stack"
    priority: 95
    patterns: ["ambassador", "datawire/ambassador"]
    system_type: "APIGateway"
    actor_name: "Ambassador"
    actor_description: "Kubernetes-native API gateway"
    
  - name: "Traefik API Gateway"
    description: "Traefik reverse proxy"
    priority: 95
    patterns: ["traefik", "containous/traefik"]
    system_type: "APIGateway"
    actor_name: "Traefik"
    actor_description: "Cloud-native edge router"
    
  # Circuit Breakers
  - name: "Hystrix Circuit Breaker"
    description: "Netflix Hystrix circuit breaker"
    priority: 100
    patterns: ["netflix.hystrix", "spring-cloud-starter-netflix-hystrix"]
    system_type: "CircuitBreaker"
    actor_name: "Hystrix"
    actor_description: "Circuit breaker library"
    
  - name: "Resilience4j Circuit Breaker"
    description: "Resilience4j fault tolerance"
    priority: 95
    patterns: ["io.github.resilience4j", "resilience4j"]
    system_type: "CircuitBreaker"
    actor_name: "Resilience4j"
    actor_description: "Fault tolerance library"
    
  - name: "Polly Circuit Breaker"
    description: "Polly resilience framework"
    priority: 90
    patterns: ["polly", "microsoft.extensions.http.polly"]
    system_type: "CircuitBreaker"
    actor_name: "Polly"
    actor_description: "Resilience and transient-fault-handling"
    
  # Service Mesh
  - name: "Istio Service Mesh"
    description: "Istio service mesh"
    priority: 100
    patterns: ["istio.io", "istio"]
    system_type: "ServiceMesh"
    actor_name: "Istio"
    actor_description: "Service mesh platform"
    
  - name: "Linkerd Service Mesh"
    description: "Linkerd service mesh"
    priority: 95
    patterns: ["linkerd.io", "linkerd"]
    system_type: "ServiceMesh"
    actor_name: "Linkerd"
    actor_description: "Ultralight service mesh"
    
  - name: "Consul Connect Service Mesh"
    description: "Consul Connect service mesh"
    priority: 90
    patterns: ["consul.io/connect", "consul-connect"]
    system_type: "ServiceMesh"
    actor_name: "Consul Connect"
    actor_description: "Service mesh solution"
    
  # Distributed Tracing
  - name: "Jaeger Distributed Tracing"
    description: "Jaeger tracing system"
    priority: 100
    patterns: ["jaeger", "opentelemetry-jaeger"]
    system_type: "DistributedTracing"
    actor_name: "Jaeger"
    actor_description: "Distributed tracing system"
    
  - name: "Zipkin Distributed Tracing"
    description: "Zipkin tracing system"
    priority: 95
    patterns: ["zipkin", "spring-cloud-starter-zipkin"]
    system_type: "DistributedTracing"
    actor_name: "Zipkin"
    actor_description: "Distributed tracing system"
    
  - name: "OpenTelemetry"
    description: "OpenTelemetry observability"
    priority: 100
    patterns: ["opentelemetry", "otel"]
    system_type: "DistributedTracing"
    actor_name: "OpenTelemetry"
    actor_description: "Observability framework"

containers:
  # Service Containers
  - name: "Microservice Container"
    description: "Individual microservice container"
    priority: 90
    framework_patterns: ["spring-boot", "micronaut", "quarkus", "go-kit"]
    directory_patterns: ["services/*", "microservices/*", "src/*/service"]
    file_patterns: ["*service*", "*microservice*"]
    container_type: "Microservice"
    container_name: "Microservice"
    technology: ["REST", "gRPC", "Message Queue"]
    
  - name: "API Gateway Container"
    description: "API gateway container"
    priority: 95
    framework_patterns: ["kong", "zuul", "ambassador", "traefik"]
    directory_patterns: ["gateway", "api-gateway", "edge"]
    container_type: "APIGateway"
    container_name: "API Gateway"
    technology: ["REST", "OAuth", "Rate Limiting"]
    
  - name: "Service Discovery Container"
    description: "Service discovery container"
    priority: 90
    framework_patterns: ["consul", "eureka", "etcd"]
    directory_patterns: ["discovery", "registry", "service-registry"]
    container_type: "ServiceDiscovery"
    container_name: "Service Discovery"
    technology = ["DNS", "HTTP", "gRPC"]

components:
  # Service Components
  - name: "Service Controller"
    description: "REST controller in microservice"
    priority: 90
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Controller"
    name_patterns: ["*Controller", "*Endpoint", "*Handler"]
    
  - name: "Service Implementation"
    description: "Service implementation class"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.5
    max_per_file: 3
    component_type: "Service"
    name_patterns: ["*Service", "*ServiceImpl"]
    
  - name: "Service Repository"
    description: "Data access in microservice"
    priority: 80
    entity_types: ["class", "interface"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Repository"
    name_patterns: ["*Repository", "*Dao"]
    
  # Circuit Breaker Components
  - name: "Circuit Breaker"
    description: "Circuit breaker component"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.3
    max_per_file: 2
    component_type: "CircuitBreaker"
    name_patterns: ["*CircuitBreaker", "*Fallback", "*Bulkhead"]
