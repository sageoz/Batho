# Enhanced rules for event-driven architecture detection

external_systems:
  # Message Brokers
  - name: "Apache Kafka"
    description: "Apache Kafka distributed streaming platform"
    priority: 100
    patterns: ["kafka", "org.apache.kafka", "confluent"]
    system_type: "MessageBroker"
    actor_name: "Kafka"
    actor_description: "Distributed streaming platform"
    
  - name: "RabbitMQ"
    description: "RabbitMQ message broker"
    priority: 95
    patterns: ["rabbitmq", "amqp", "pika"]
    system_type: "MessageBroker"
    actor_name: "RabbitMQ"
    actor_description: "Message broker"
    
  - name: "Apache Pulsar"
    description: "Apache Pulsar messaging platform"
    priority: 90
    patterns: ["pulsar", "org.apache.pulsar"]
    system_type: "MessageBroker"
    actor_name: "Pulsar"
    actor_description: "Cloud-native messaging platform"
    
  - name: "NATS"
    description: "NATS messaging system"
    priority: 85
    patterns: ["nats", "nats.io", "stan"]
    system_type: "MessageBroker"
    actor_name: "NATS"
    actor_description: "Cloud-native messaging"
    
  - name: "AWS SQS"
    description: "Amazon Simple Queue Service"
    priority: 90
    patterns: ["sqs", "aws-sdk", "boto3.sqs"]
    system_type: "MessageBroker"
    actor_name: "AWS SQS"
    actor_description: "Managed queue service"
    
  - name: "AWS SNS"
    description: "Amazon Simple Notification Service"
    priority: 90
    patterns: ["sns", "aws-sdk", "boto3.sns"]
    system_type: "MessageBroker"
    actor_name: "AWS SNS"
    actor_description: "Managed pub/sub service"
    
  - name: "Azure Service Bus"
    description: "Azure Service Bus messaging"
    priority: 85
    patterns: ["azure.servicebus", "servicebus"]
    system_type: "MessageBroker"
    actor_name: "Azure Service Bus"
    actor_description: "Enterprise messaging service"
    
  - name: "Google Pub/Sub"
    description: "Google Cloud Pub/Sub"
    priority: 85
    patterns: ["pubsub", "google.cloud.pubsub"]
    system_type: "MessageBroker"
    actor_name: "Google Pub/Sub"
    actor_description: "Managed messaging service"
    
  # Event Stores
  - name: "EventStoreDB"
    description: "EventStore database"
    priority: 95
    patterns: ["eventstore", "eventstore.client"]
    system_type: "EventStore"
    actor_name: "EventStore"
    actor_description: "Event sourcing database"
    
  - name: "Kafka Event Store"
    description: "Kafka as event store"
    priority: 90
    patterns: ["kafka-streams", "kafka-state-store"]
    system_type: "EventStore"
    actor_name: "Kafka Event Store"
    actor_description: "Kafka-based event store"
    
  # Stream Processing
  - name: "Kafka Streams"
    description: "Kafka Streams processing"
    priority: 95
    patterns: ["kafka-streams", "org.apache.kafka.streams"]
    system_type: "StreamProcessor"
    actor_name: "Kafka Streams"
    actor_description: "Stream processing library"
    
  - name: "Apache Flink"
    description: "Apache Flink stream processing"
    priority: 95
    patterns: ["flink", "org.apache.flink"]
    system_type: "StreamProcessor"
    actor_name: "Flink"
    actor_description: "Stream processing framework"
    
  - name: "Apache Spark Streaming"
    description: "Spark Streaming"
    priority: 90
    patterns: ["spark-streaming", "org.apache.spark.streaming"]
    system_type: "StreamProcessor"
    actor_name: "Spark Streaming"
    actor_description: "Stream processing engine"
    
  - name: "AWS Kinesis"
    description: "Amazon Kinesis streams"
    priority: 85
    patterns: ["kinesis", "aws-sdk", "boto3.kinesis"]
    system_type: "StreamProcessor"
    actor_name: "AWS Kinesis"
    actor_description: "Managed streaming service"
    
  # Event Buses
  - name: "AWS EventBridge"
    description: "Amazon EventBridge"
    priority: 90
    patterns: ["eventbridge", "aws.events"]
    system_type: "EventBus"
    actor_name: "AWS EventBridge"
    actor_description: "Event bus service"
    
  - name: "Azure Event Grid"
    description: "Azure Event Grid"
    priority: 85
    patterns: ["eventgrid", "azure.eventgrid"]
    system_type: "EventBus"
    actor_name: "Azure Event Grid"
    actor_description: "Event routing service"

containers:
  # Event-Driven Containers
  - name: "Event Producer"
    description: "Event producer container"
    priority: 90
    framework_patterns: ["kafka-producer", "event-producer"]
    directory_patterns: ["producers", "events/*", "event-sources"]
    file_patterns: ["*producer*", "*publisher*", "*emitter*"]
    container_type: "EventProducer"
    container_name: "Event Producer"
    technology: ["Events", "Messaging", "Async"]
    
  - name: "Event Consumer"
    description: "Event consumer container"
    priority: 90
    framework_patterns: ["kafka-consumer", "event-consumer"]
    directory_patterns: ["consumers", "handlers", "processors"]
    file_patterns: ["*consumer*", "*subscriber*", "*listener*"]
    container_type: "EventConsumer"
    container_name: "Event Consumer"
    technology: ["Events", "Messaging", "Async"]
    
  - name: "Event Stream Processor"
    description: "Stream processing container"
    priority: 95
    framework_patterns: ["kafka-streams", "flink", "spark-streaming"]
    directory_patterns: ["streams", "processors", "analytics"]
    file_patterns: ["*stream*", "*processor*", "*analytics*"]
    container_type: "StreamProcessor"
    container_name: "Stream Processor"
    technology: ["Stream Processing", "Real-time", "Analytics"]
    
  - name: "CQRS Read Model"
    description: "CQRS read model container"
    priority: 85
    framework_patterns: ["cqrs", "read-model"]
    directory_patterns: ["read-models", "queries", "projections"]
    file_patterns: ["*query*", "*readmodel*", "*projection*"]
    container_type: "ReadModel"
    container_name: "Read Model"
    technology = ["CQRS", "Event Sourcing", "Read-Optimized"]
    
  - name: "CQRS Write Model"
    description: "CQRS write model container"
    priority: 85
    framework_patterns: ["cqrs", "write-model"]
    directory_patterns: ["write-models", "commands", "aggregates"]
    file_patterns: ["*command*", "*writemodel*", "*aggregate*"]
    container_type: "WriteModel"
    container_name: "Write Model"
    technology = ["CQRS", "Event Sourcing", "Write-Optimized"]

components:
  # Event Components
  - name: "Event Producer"
    description: "Event producer component"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type: "EventProducer"
    name_patterns = ["*Producer", "*Publisher", "*Emitter"]
    
  - name: "Event Consumer"
    description: "Event consumer component"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type: "EventConsumer"
    name_patterns = ["*Consumer", "*Subscriber", "*Listener"]
    
  - name: "Event Handler"
    description: "Event handler component"
    priority: 80
    entity_types: ["class", "function"]
    importance_threshold: 0.3
    max_per_file: 5
    component_type: "EventHandler"
    name_patterns = ["*Handler", "*Processor", "*On*"]
    
  - name: "Event Aggregator"
    description: "Event aggregator component"
    priority: 75
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 2
    component_type: "EventAggregator"
    name_patterns = ["*Aggregator", "*Reducer", "*Combiner"]
    
  # CQRS Components
  - name: "Command Handler"
    description: "CQRS command handler"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type: "CommandHandler"
    name_patterns = ["*CommandHandler", "*CommandService"]
    
  - name: "Query Handler"
    description: "CQRS query handler"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type: "QueryHandler"
    name_patterns = ["*QueryHandler", "*QueryService"]
    
  - name: "Aggregate Root"
    description: "DDD aggregate root"
    priority: 80
    entity_types: ["class"]
    importance_threshold: 0.5
    max_per_file: 2
    component_type: "AggregateRoot"
    name_patterns = ["*Aggregate", "*AggregateRoot"]
