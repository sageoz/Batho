# Enhanced rules for data architecture pattern detection

external_systems:
  # Sharding Solutions
  - name: "ShardingSphere"
    description: "ShardingSphere database sharding"
    priority: 95
    patterns: ["shardingsphere", "apache.shardingsphere"]
    system_type: "ShardingSolution"
    actor_name: "ShardingSphere"
    actor_description: "Database sharding solution"
    
  - name: "Vitess"
    description: "Vitess database clustering"
    priority: 95
    patterns: ["vitess", "vitess.io"]
    system_type: "ShardingSolution"
    actor_name: "Vitess"
    actor_description: "Database clustering system"
    
  - name: "Citus"
    description: "Citus PostgreSQL extension"
    priority: 90
    patterns: ["citus", "citusdata"]
    system_type: "ShardingSolution"
    actor_name: "Citus"
    actor_description = "PostgreSQL extension for scaling"
    
  # Replication Solutions
  - name: "MySQL Replication"
    description: "MySQL master-slave replication"
    priority: 90
    patterns: ["mysql-replication", "replication"]
    system_type: "ReplicationSolution"
    actor_name: "MySQL Replication"
    actor_description = "Database replication"
    
  - name: "PostgreSQL Replication"
    description: "PostgreSQL replication"
    priority: 90
    patterns: ["pglogical", "wal2json", "postgres-replication"]
    system_type: "ReplicationSolution"
    actor_name: "PostgreSQL Replication"
    actor_description = "PostgreSQL replication"
    
  - name: "MongoDB Replica Set"
    description: "MongoDB replica sets"
    priority: 95
    patterns: ["mongodb-replica", "replica-set"]
    system_type: "ReplicationSolution"
    actor_name: "MongoDB Replica"
    actor_description = "MongoDB replication"
    
  # CQRS Frameworks
  - name: "Axon Framework"
    description: "Axon CQRS framework"
    priority: 95
    patterns: ["axon", "axonframework"]
    system_type: "CQRSFramework"
    actor_name: "Axon"
    actor_description = "CQRS and Event Sourcing framework"
    
  - name: "MediatR"
    description: "MediatR mediator pattern"
    priority: 85
    patterns: ["mediatr", "mediat-r"]
    system_type: "CQRSFramework"
    actor_name: "MediatR"
    actor_description = "Mediator pattern implementation"
    
  - name: "EventFlow"
    description: "EventFlow CQRS/ES"
    priority: 80
    patterns: ["eventflow", "event-flow"]
    system_type: "CQRSFramework"
    actor_name: "EventFlow"
    actor_description = "CQRS/Event Sourcing framework"
    
  # Multi-Database Tools
  - name: "Flyway"
    description: "Flyway database migrations"
    priority: 90
    patterns: ["flyway", "org.flywaydb"]
    system_type: "MigrationTool"
    actor_name: "Flyway"
    actor_description = "Database migration tool"
    
  - name: "Liquibase"
    description: "Liquibase database migrations"
    priority: 90
    patterns: ["liquibase", "org.liquibase"]
    system_type: "MigrationTool"
    actor_name: "Liquibase"
    actor_description = "Database migration tool"
    
  - name: "Prisma"
    description: "Prisma database toolkit"
    priority: 85
    patterns: ["prisma", "@prisma"]
    system_type: "ORMTool"
    actor_name: "Prisma"
    actor_description = "Next-generation ORM"

containers:
  # Data Architecture Containers
  - name: "Sharded Database"
    description: "Sharded database cluster"
    priority: 95
    framework_patterns: ["shardingsphere", "vitess", "citus"]
    directory_patterns: ["shards", "partitions", "cluster"]
    file_patterns = ["*shard*", "*partition*", "*cluster*"]
    container_type = "ShardedDatabase"
    container_name = "Sharded Database"
    technology = ["Database Sharding", "Horizontal Scaling", "Partitioning"]
    
  - name: "Read Replica"
    description: "Database read replica"
    priority: 90
    framework_patterns: ["replication", "read-replica"]
    directory_patterns = ["replicas", "slaves", "read-only"]
    file_patterns = ["*replica*", "*slave*", "*readonly*"]
    container_type = "ReadReplica"
    container_name = "Read Replica"
    technology = ["Database Replication", "Read Scaling", "HA"]
    
  - name: "CQRS Write Side"
    description: "CQRS write model"
    priority: 85
    framework_patterns: ["cqrs", "axon", "mediatr"]
    directory_patterns = ["write", "commands", "domain"]
    file_patterns = ["*command*", "*write*", "*domain*"]
    container_type = "CQRSWrite"
    container_name = "Write Model"
    technology = ["CQRS", "Command Pattern", "Domain Model"]
    
  - name: "CQRS Read Side"
    description: "CQRS read model"
    priority: 85
    framework_patterns: ["cqrs", "axon", "mediatr"]
    directory_patterns = ["read", "query", "projection"]
    file_patterns = ["*query*", "*read*", "*projection*"]
    container_type = "CQRSRead"
    container_name = "Read Model"
    technology = ["CQRS", "Query Pattern", "Denormalization"]
    
  - name: "Event Store"
    description: "Event sourcing store"
    priority: 90
    framework_patterns: ["eventstore", "event-sourcing"]
    directory_patterns = ["events", "eventstore", "sourcing"]
    file_patterns = ["*event*", "*sourcing*", "*store*"]
    container_type = "EventStore"
    container_name = "Event Store"
    technology = ["Event Sourcing", "Immutable Log", "Append-Only"]

components:
  # Data Architecture Components
  - name: "Shard Manager"
    description: "Database shard manager"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.5
    max_per_file: 2
    component_type = "ShardManager"
    name_patterns = ["*ShardManager*", "*PartitionManager*", "*Sharding*"]
    
  - name: "Replication Manager"
    description: "Database replication manager"
    priority: 80
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 2
    component_type = "ReplicationManager"
    name_patterns = ["*ReplicationManager*", "*SyncManager*", "*Replica*"]
    
  - name: "Command Handler"
    description: "CQRS command handler"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type = "CommandHandler"
    name_patterns = ["*CommandHandler*", "*CommandService*", "*Execute*"]
    
  - name: "Query Handler"
    description: "CQRS query handler"
    priority: 85
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type = "QueryHandler"
    name_patterns = ["*QueryHandler*", "*QueryService*", "*Find*"]
    
  - name: "Event Sourcing Handler"
    description: "Event sourcing handler"
    priority: 80
    entity_types: ["class"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type = "EventSourcingHandler"
    name_patterns = ["*EventSourcing*", "*EventStore*", "*Append*"]
    
  - name: "Data Mapper"
    description: "Data mapping component"
    priority: 75
    entity_types: ["class"]
    importance_threshold: 0.3
    max_per_file: 5
    component_type = "DataMapper"
    name_patterns = ["*Mapper*", "*Mapping*", "*Converter*"]
    
  - name: "Database Connection"
    description: "Database connection pool"
    priority: 70
    entity_types: ["class"]
    importance_threshold: 0.3
    max_per_file: 2
    component_type = "DatabaseConnection"
    name_patterns = ["*Connection*", "*DataSource*", "*Pool*"]
