# Base External System Detection Rules
# Common external system patterns applicable to all languages

external_systems:
  - name: "Database Detection"
    description: "Detect database systems from ORM and driver imports"
    priority: 100
    patterns:
      # SQL Databases
      - "sqlalchemy"
      - "django.db"
      - "psycopg"
      - "asyncpg"
      - "aiosqlite"
      - "sqlite3"
      - "pymysql"
      - "mysql-connector"
      - "postgresql"
      - "pg"
      # NoSQL Databases
      - "pymongo"
      - "redis"
      - "cassandra"
      - "elasticsearch"
      - "neo4j"
      - "influxdb"
      # ORMs
      - "tortoise"
      - "peewee"
      - "pony"
      - "sqlmodel"
      - "prisma"
    system_type: "Database"
    actor_name: "Database"
    actor_description: "Data storage and management system"

  - name: "External API Detection"
    description: "Detect external API usage from HTTP client libraries"
    priority: 90
    patterns:
      # HTTP Clients
      - "requests"
      - "httpx"
      - "aiohttp"
      - "urllib"
      - "http.client"
      - "fetch"
      - "axios"
      - "got"
      - "superagent"
      - "ky"
      # API Clients
      - "google-api"
      - "aws-sdk"
      - "azure-sdk"
      - "stripe"
      - "twilio"
      - "sendgrid"
    system_type: "ExternalAPI"
    actor_name: "External API"
    actor_description: "Third-party API service"

  - name: "Message Queue Detection"
    description: "Detect message queue systems from messaging libraries"
    priority: 95
    patterns:
      # Message Brokers
      - "celery"
      - "rabbitmq"
      - "kafka"
      - "pika"
      - "kombu"
      - "sqs"
      - "pubsub"
      - "nats"
      - "zeromq"
      - "activemq"
      - "pulsar"
      # Client Libraries
      - "redis-py"
      - "kafka-python"
      - "amqp"
    system_type: "MessageQueue"
    actor_name: "Message Broker"
    actor_description: "Asynchronous messaging system"

  - name: "File System Detection"
    description: "Detect file system operations"
    priority: 50
    patterns:
      # File Operations
      - "pathlib"
      - "os.path"
      - "shutil"
      - "tempfile"
      - "glob"
      - "open("
      - "file("
      - "read("
      - "write("
      # Cloud Storage
      - "boto3"  # S3
      - "google-cloud-storage"
      - "azure-storage-blob"
      - "minio"
    system_type: "FileSystem"
    actor_name: "File System"
    actor_description: "File storage and management system"

  - name: "Authentication Detection"
    description: "Detect authentication and authorization services"
    priority: 85
    patterns:
      # Auth Services
      - "auth0"
      - "firebase.auth"
      - "okta"
      - "cognito"
      # Auth Libraries
      - "jwt"
      - "oauth"
      - "passport"
      - "login"
      - "authenticate"
      - "authorize"
      - "token"
      # SSO
      - "saml"
      - "openid"
      - "ldap"
    system_type: "Authentication"
    actor_name: "Identity Provider"
    actor_description: "Authentication and authorization service"

  - name: "Email Service Detection"
    description: "Detect email sending capabilities"
    priority: 70
    patterns:
      # Email Libraries
      - "smtplib"
      - "email"
      # Email Services
      - "sendgrid"
      - "mailgun"
      - "ses"
      - "mailchimp"
      - "postmark"
      - "sparkpost"
    system_type: "Email"
    actor_name: "Email Service"
    actor_description: "Email delivery service"

  - name: "Cloud Platform Detection"
    description: "Detect cloud platform SDK usage"
    priority: 80
    patterns:
      # AWS
      - "boto3"
      - "botocore"
      - "aws-sdk"
      # Google Cloud
      - "google-cloud"
      - "gcloud"
      # Azure
      - "azure"
      - "azure-sdk"
      # Other Cloud
      - "cloudflare"
      - "digitalocean"
      - "linode"
      - "vultr"
    system_type: "CloudPlatform"
    actor_name: "Cloud Platform"
    actor_description: "Cloud infrastructure provider"

  - name: "Web Server Detection"
    description: "Detect web server and reverse proxy usage"
    priority: 60
    patterns:
      # WSGI Servers
      - "gunicorn"
      - "uvicorn"
      - "daphne"
      - "hypercorn"
      - "waitress"
      - "mod_wsgi"
      # Web Servers
      - "nginx"
      - "apache"
      - "httpd"
      # Proxies
      - "haproxy"
      - "traefik"
    system_type: "WebServer"
    actor_name: "Web Server"
    actor_description: "HTTP server and reverse proxy"

  - name: "Cache Detection"
    description: "Detect caching systems"
    priority: 75
    patterns:
      # Cache Systems
      - "memcached"
      - "redis"
      - "dynamodb"
      # Cache Libraries
      - "cache"
      - "lru_cache"
      - "functools.cache"
      # CDN
      - "cloudflare"
      - "fastly"
      - "akamai"
    system_type: "Cache"
    actor_name: "Cache"
    actor_description: "Data caching system"

  - name: "Search Engine Detection"
    description: "Detect search engine integration"
    priority: 72
    patterns:
      # Search Engines
      - "elasticsearch"
      - "solr"
      - "algolia"
      - "whoosh"
      - "lucene"
      - "sphinx"
      - "opensearch"
      - "typesense"
    system_type: "SearchEngine"
    actor_name: "Search Engine"
    actor_description: "Full-text search service"

  - name: "Monitoring Detection"
    description: "Detect monitoring and observability tools"
    priority: 65
    patterns:
      # Monitoring
      - "prometheus"
      - "datadog"
      - "newrelic"
      - "grafana"
      # Logging
      - "logstash"
      - "fluentd"
      - "splunk"
      # Tracing
      - "jaeger"
      - "zipkin"
      - "opentelemetry"
    system_type: "Monitoring"
    actor_name: "Monitoring System"
    actor_description: "Monitoring and observability platform"

  - name: "Payment Processing Detection"
    description: "Detect payment processing services"
    priority: 88
    patterns:
      # Payment Services
      - "stripe"
      - "paypal"
      - "braintree"
      - "square"
      - "adyen"
      # Payment Libraries
      - "payment"
      - "billing"
      - "invoice"
    system_type: "Payment"
    actor_name: "Payment Processor"
    actor_description: "Payment processing service"

  - name: "Analytics Detection"
    description: "Detect analytics and tracking services"
    priority: 55
    patterns:
      # Analytics Services
      - "google-analytics"
      - "mixpanel"
      - "segment"
      - "amplitude"
      - "heap"
      # Tracking Libraries
      - "analytics"
      - "tracking"
      - "metrics"
    system_type: "Analytics"
    actor_name: "Analytics Service"
    actor_description: "Analytics and tracking platform"

  - name: "CDN Detection"
    description: "Detect Content Delivery Network usage"
    priority: 58
    patterns:
      # CDN Providers
      - "cloudflare"
      - "fastly"
      - "akamai"
      - "cloudfront"
      - "azure-cdn"
      # CDN Libraries
      - "cdn"
      - "static"
    system_type: "CDN"
    actor_name: "CDN"
    actor_description: "Content Delivery Network"
