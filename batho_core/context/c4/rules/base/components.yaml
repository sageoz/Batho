# Base Component Detection Rules
# Generic component patterns applicable across languages

components:
  - name: "Controller Components"
    description: "Identify controller/view components that handle requests"
    priority: 100
    entity_types: ["class", "function", "method"]
    importance_threshold: 0.6
    max_per_file: 5
    component_type: "Controller"
    name_patterns:
      # Controller naming patterns
      - "*Controller"
      - "*Ctrl"
      - "*Handler"
      - "*View"
      - "*Endpoint"
      - "*Route"
      - "*Resource"
      # HTTP method patterns
      - "get_*"
      - "post_*"
      - "put_*"
      - "delete_*"
      - "patch_*"
    file_patterns:
      - "controller/"
      - "handlers/"
      - "views/"
      - "routes/"
      - "endpoints/"
      - "api/"

  - name: "Service Components"
    description: "Identify service layer components with business logic"
    priority: 95
    entity_types: ["class", "function"]
    importance_threshold: 0.5
    max_per_file: 3
    component_type: "Service"
    name_patterns:
      # Service naming patterns
      - "*Service"
      - "*ServiceImpl"
      - "*Business"
      - "*Logic"
      - "*Manager"
      - "*Orchestrator"
      - "*Coordinator"
      # Business operation patterns
      - "process*"
      - "calculate*"
      - "execute*"
      - "perform*"
      - "handle*"
    file_patterns:
      - "service/"
      - "services/"
      - "business/"
      - "logic/"
      - "domain/"

  - name: "Model Components"
    description: "Identify data model components"
    priority: 90
    entity_types: ["class", "struct", "interface"]
    importance_threshold: 0.4
    max_per_file: 10
    component_type: "Model"
    name_patterns:
      # Model naming patterns
      - "*Model"
      - "*Entity"
      - "*DTO"
      - "*VO"  # Value Object
      - "*POJO"  # Plain Old Java Object
      - "*Record"
      - "*Schema"
      # Domain object patterns
      - "User"
      - "Account"
      - "Order"
      - "Product"
      - "Customer"
      - "Transaction"
    file_patterns:
      - "model/"
      - "models/"
      - "entity/"
      - "entities/"
      - "domain/"
      - "dto/"
      - "schema/"

  - name: "Repository Components"
    description: "Identify repository/DAO components for data access"
    priority: 88
    entity_types: ["class", "interface"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Repository"
    name_patterns:
      # Repository naming patterns
      - "*Repository"
      - "*Repo"
      - "*DAO"
      - "*Mapper"
      - "*Store"
      - "*Persistence"
      # Data access patterns
      - "find*"
      - "save*"
      - "delete*"
      - "update*"
      - "query*"
      - "select*"
    file_patterns:
      - "repository/"
      - "repositories/"
      - "dao/"
      - "persistence/"
      - "storage/"
      - "data/"

  - name: "Utility Components"
    description: "Identify utility/helper components"
    priority: 70
    entity_types: ["function", "class", "module"]
    importance_threshold: 0.3
    max_per_file: 3
    component_type: "Utility"
    name_patterns:
      # Utility naming patterns
      - "*Util"
      - "*Utils"
      - "*Helper"
      - "*Tool"
      - "*Common"
      - "*Shared"
      # Common utility patterns
      - "format*"
      - "parse*"
      - "convert*"
      - "validate*"
      - "sanitize*"
      - "normalize*"
    file_patterns:
      - "util/"
      - "utils/"
      - "helper/"
      - "tools/"
      - "common/"
      - "shared/"

  - name: "Configuration Components"
    description: "Identify configuration components"
    priority: 75
    entity_types: ["class", "function", "module"]
    importance_threshold: 0.3
    max_per_file: 2
    component_type: "Configuration"
    name_patterns:
      # Configuration naming patterns
      - "*Config"
      - "*Configuration"
      - "*Settings"
      - "*Properties"
      - "*Options"
      - "*Params"
      # Config-related patterns
      - "load*"
      - "init*"
      - "setup*"
      - "configure*"
    file_patterns:
      - "config/"
      - "conf/"
      - "settings/"
      - "properties/"
      - ".env"
      - "config.*"

  - name: "Middleware Components"
    description: "Identify middleware components"
    priority: 85
    entity_types: ["class", "function"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Middleware"
    name_patterns:
      # Middleware naming patterns
      - "*Middleware"
      - "*Filter"
      - "*Interceptor"
      - "*Wrapper"
      - "*Decorator"
      # Middleware action patterns
      - "auth*"
      - "cors*"
      - "logging*"
      - "cache*"
      - "compress*"
    file_patterns:
      - "middleware/"
      - "filters/"
      - "interceptors/"
      - "decorators/"

  - name: "Validator Components"
    description: "Identify validation components"
    priority: 80
    entity_types: ["class", "function"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Validator"
    name_patterns:
      # Validator naming patterns
      - "*Validator"
      - "*Validation"
      - "*Rule"
      - "*Checker"
      - "*Verifier"
      # Validation patterns
      - "validate*"
      - "check*"
      - "verify*"
      - "ensure*"
      - "assert*"
    file_patterns:
      - "validator/"
      - "validation/"
      - "rules/"
      - "checks/"

  - name: "Transformer Components"
    description: "Identify data transformation components"
    priority: 77
    entity_types: ["class", "function"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Transformer"
    name_patterns:
      # Transformer naming patterns
      - "*Transformer"
      - "*Converter"
      - "*Mapper"
      - "*Adapter"
      - "*Translator"
      # Transformation patterns
      - "transform*"
      - "convert*"
      - "map*"
      - "adapt*"
      - "translate*"
      - "serialize*"
      - "deserialize*"
    file_patterns:
      - "transformer/"
      - "converter/"
      - "mapper/"
      - "adapter/"

  - name: "Factory Components"
    description: "Identify factory pattern components"
    priority: 72
    entity_types: ["class", "function"]
    importance_threshold: 0.4
    max_per_file: 3
    component_type: "Factory"
    name_patterns:
      # Factory naming patterns
      - "*Factory"
      - "*Builder"
      - "*Creator"
      - "*Provider"
      - "*Producer"
      # Factory patterns
      - "create*"
      - "build*"
      - "make*"
      - "new*"
      - "get*"
    file_patterns:
      - "factory/"
      - "builder/"
      - "creator/"

  - name: "Observer Components"
    description: "Identify observer/event pattern components"
    priority: 78
    entity_types: ["class", "interface"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Observer"
    name_patterns:
      # Observer naming patterns
      - "*Observer"
      - "*Listener"
      - "*Subscriber"
      - "*Handler"
      - "*Callback"
      # Event patterns
      - "on*"
      - "handle*"
      - "notify*"
      - "emit*"
      - "publish*"
      - "subscribe*"
    file_patterns:
      - "observer/"
      - "listener/"
      - "events/"
      - "handlers/"

  - name: "Client Components"
    description: "Identify client components for external services"
    priority: 83
    entity_types: ["class", "interface"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Client"
    name_patterns:
      # Client naming patterns
      - "*Client"
      - "*ServiceClient"
      - "*ApiClient"
      - "*Connector"
      - "*Gateway"
      - "*Proxy"
      # Client patterns
      - "connect*"
      - "request*"
      - "fetch*"
      - "call*"
    file_patterns:
      - "client/"
      - "clients/"
      - "connector/"
      - "gateway/"
      - "proxy/"

  - name: "Security Components"
    description: "Identify security-related components"
    priority: 86
    entity_types: ["class", "function"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Security"
    name_patterns:
      # Security naming patterns
      - "*Auth"
      - "*Security"
      - "*Authorizer"
      - "*Permission"
      - "*Role"
      - "*Policy"
      # Security patterns
      - "login*"
      - "logout*"
      - "authenticate*"
      - "authorize*"
      - "encrypt*"
      - "decrypt*"
      - "hash*"
      - "token*"
    file_patterns:
      - "auth/"
      - "security/"
      - "permission/"
      - "policy/"
