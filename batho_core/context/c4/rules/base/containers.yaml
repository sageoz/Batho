# Base Container Detection Rules
# Universal container types applicable across languages

containers:
  - name: "Web Application Container"
    description: "Detect web application containers from web frameworks"
    priority: 100
    framework_patterns:
      # Python Web Frameworks
      - "Flask"
      - "Django"
      - "FastAPI"
      - "Starlette"
      - "Tornado"
      - "Pyramid"
      - "Sanic"
      # Java Web Frameworks
      - "Spring Boot"
      - "Spring MVC"
      - "Spring Web"
      - "Jakarta EE"
      - "JavaServer Faces"
      - "Vaadin"
      # JavaScript/Node.js Frameworks
      - "Express"
      - "Koa"
      - "Hapi"
      - "NestJS"
      - "Fastify"
      # Go Web Frameworks
      - "Gin"
      - "Echo"
      - "Chi"
      - "Fiber"
      - "Gorilla Mux"
      # TypeScript Frameworks
      - "Next.js"
      - "Nuxt.js"
      - "SvelteKit"
      - "Astro"
    directory_patterns:
      - "web"
      - "app"
      - "server"
      - "api"
      - "www"
      - "http"
    file_patterns:
      - "app.py"
      - "server.js"
      - "main.go"
      - "Application.java"
      - "index.ts"
      - "routes.py"
      - "controllers/"
    container_type: "Web Application"
    container_name: "Web Application"
    technology: ["HTTP", "REST", "JSON", "WebSockets"]

  - name: "API Service Container"
    description: "Detect API service containers"
    priority: 95
    framework_patterns:
      - "FastAPI"
      - "Starlette"
      - "REST"
      - "GraphQL"
      - "gRPC"
      - "OpenAPI"
      - "Swagger"
      - "Spring REST"
      - "Spring GraphQL"
      - "NestJS"
      - "Apollo GraphQL"
    directory_patterns:
      - "api"
      - "service"
      - "endpoint"
      - "rest"
      - "graphql"
      - "grpc"
    file_patterns:
      - "api.py"
      - "routes.js"
      - "controller/"
      - "handler/"
      - "endpoint/"
    container_type: "API Service"
    container_name: "API Service"
    technology: ["REST", "JSON", "OpenAPI", "GraphQL"]

  - name: "Database Container"
    description: "Detect database containers from ORM usage"
    priority: 90
    framework_patterns:
      # ORMs
      - "SQLAlchemy"
      - "Django ORM"
      - "Tortoise ORM"
      - "Peewee"
      - "Pony ORM"
      - "SQLModel"
      - "Prisma"
      - "TypeORM"
      - "Sequelize"
      - "Mongoose"
      - "GORM"
      - "Hibernate"
      - "JPA"
      - "MyBatis"
      # Database Drivers
      - "psycopg"
      - "asyncpg"
      - "redis-py"
      - "pymongo"
      - "mysql-connector"
    directory_patterns:
      - "db"
      - "database"
      - "models"
      - "schema"
      - "entities"
      - "repositories"
      - "dao"
    file_patterns:
      - "models.py"
      - "schema.sql"
      - "migration/"
      - "entity/"
      - "Model.java"
    container_type: "Database"
    container_name: "Database"
    technology: ["SQL", "ORM", "NoSQL"]

  - name: "CLI Tool Container"
    description: "Detect CLI application containers"
    priority: 85
    framework_patterns:
      # Python CLI Libraries
      - "Click"
      - "Typer"
      - "Argparse"
      - "Docopt"
      - "Cement"
      # Java CLI Libraries
      - "Picocli"
      - "JCommander"
      - "Spring Shell"
      # Node.js CLI Libraries
      - "Commander.js"
      - "Yargs"
      - "Caporal"
      # Go CLI Libraries
      - "Cobra"
      - "urfave/cli"
      - "flag"
    directory_patterns:
      - "cli"
      - "cmd"
      - "script"
      - "bin"
      - "tools"
    file_patterns:
      - "cli.py"
      - "main.go"
      - "commander.js"
      - "main.rs"
      - "*.cli"
    container_type: "CLI Application"
    container_name: "CLI Tool"
    technology: ["Command Line", "Terminal"]

  - name: "Background Worker Container"
    description: "Detect background worker containers"
    priority: 88
    framework_patterns:
      # Python Task Queues
      - "Celery"
      - "RQ"
      - "Dramatiq"
      - "Huey"
      # Java Message Systems
      - "Spring Kafka"
      - "Spring JMS"
      - "ActiveMQ"
      # Node.js Workers
      - "Bull"
      - "Bee-Queue"
      - "Kue"
      # Go Workers
      - "asynq"
      - "machinery"
    directory_patterns:
      - "worker"
      - "task"
      - "job"
      - "background"
      - "queue"
      - "processor"
    file_patterns:
      - "worker.py"
      - "tasks.py"
      - "job.js"
      - "processor.go"
      - "scheduler/"
    container_type: "Background Worker"
    container_name: "Background Worker"
    technology: ["Queue", "Async", "Message Broker"]

  - name: "Test Suite Container"
    description: "Detect test suite containers"
    priority: 70
    framework_patterns:
      # Python Testing
      - "pytest"
      - "unittest"
      - "nose"
      - "doctest"
      - "hypothesis"
      # Java Testing
      - "JUnit"
      - "TestNG"
      - "Mockito"
      - "AssertJ"
      # JavaScript Testing
      - "Jest"
      - "Mocha"
      - "Chai"
      - "Jasmine"
      - "Vitest"
      # Go Testing
      - "testify"
      - "gomock"
      - "ginkgo"
    directory_patterns:
      - "test"
      - "tests"
      - "spec"
      - "__tests__"
      - "e2e"
      - "integration"
    file_patterns:
      - "test_*.py"
      - "*_test.go"
      - "*.test.js"
      - "*Test.java"
      - "conftest.py"
    container_type: "Test Suite"
    container_name: "Test Suite"
    technology: ["Testing", "Automation", "TDD"]

  - name: "Documentation Container"
    description: "Detect documentation containers"
    priority: 60
    framework_patterns:
      # Documentation Tools
      - "Sphinx"
      - "MkDocs"
      - "GitBook"
      - "Docusaurus"
      - "VuePress"
      - "Jekyll"
      - "Hugo"
    directory_patterns:
      - "docs"
      - "doc"
      - "documentation"
      - "guide"
      - "wiki"
      - "manual"
    file_patterns:
      - "*.md"
      - "*.rst"
      - "README*"
      - "CHANGELOG*"
      - "doc/"
      - "docs/"
    container_type: "Documentation"
    container_name: "Documentation"
    technology: ["Markdown", "HTML", "Sphinx"]

  - name: "Static Assets Container"
    description: "Detect static asset containers"
    priority: 65
    framework_patterns:
      # Build Tools
      - "Webpack"
      - "Vite"
      - "Parcel"
      - "Rollup"
      - "esbuild"
      # CSS Frameworks
      - "Bootstrap"
      - "Tailwind"
      - "Bulma"
      - "Material-UI"
    directory_patterns:
      - "static"
      - "assets"
      - "public"
      - "css"
      - "js"
      - "images"
      - "media"
      - "fonts"
    file_patterns:
      - "*.css"
      - "*.scss"
      - "*.less"
      - "*.js"
      - "*.jsx"
      - "*.ts"
      - "*.tsx"
      - "webpack.config.js"
      - "vite.config.js"
    container_type: "Static Assets"
    container_name: "Static Assets"
    technology: ["CSS", "JavaScript", "Images", "Fonts"]

  - name: "Message Queue Container"
    description: "Detect message queue container systems"
    priority: 87
    framework_patterns:
      # Message Brokers
      - "Kafka"
      - "RabbitMQ"
      - "ActiveMQ"
      - "NATS"
      - "Redis"
      - "Amazon SQS"
      - "Azure Service Bus"
    directory_patterns:
      - "messaging"
      - "queue"
      - "broker"
      - "event"
      - "pubsub"
    file_patterns:
      - "producer.py"
      - "consumer.py"
      - "publisher.js"
      - "subscriber.go"
      - "message/"
    container_type: "Message Queue"
    container_name: "Message Broker"
    technology: ["Messaging", "Pub/Sub", "Event Streaming"]

  - name: "Cache Container"
    description: "Detect caching containers"
    priority: 82
    framework_patterns:
      # Cache Systems
      - "Redis"
      - "Memcached"
      - "Hazelcast"
      - "Ehcache"
      - "Caffeine"
    directory_patterns:
      - "cache"
      - "caching"
      - "store"
    file_patterns:
      - "cache.py"
      - "cache.js"
      - "CacheManager.java"
      - "cache.go"
    container_type: "Cache"
    container_name: "Cache"
    technology: ["In-Memory", "Distributed Cache"]

  - name: "Search Container"
    description: "Detect search service containers"
    priority: 78
    framework_patterns:
      # Search Engines
      - "Elasticsearch"
      - "Solr"
      - "Algolia"
      - "OpenSearch"
      - "Typesense"
    directory_patterns:
      - "search"
      - "index"
      - "elastic"
    file_patterns:
      - "search.py"
      - "indexer.js"
      - "SearchService.java"
      - "search.go"
    container_type: "Search Service"
    container_name: "Search Engine"
    technology: ["Full-Text Search", "Indexing"]
