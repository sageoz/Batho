# Go-specific C4 Generation Rules

language: "go"
description: "Rules for Go applications including web frameworks, gRPC, and common Go packages"
file_extensions: [".go"]

# Go-specific external system rules
external_systems:
  - name: "Go Database Detection"
    description: "Detect Go database systems and ORMs"
    priority: 110
    patterns:
      # SQL Drivers
      - "database/sql"
      - "github.com/lib/pq"
      - "github.com/go-sql-driver/mysql"
      - "github.com/mattn/go-sqlite3"
      - "github.com/denisenkom/go-mssqldb"
      # ORMs
      - "gorm.io/gorm"
      - "github.com/jinzhu/gorm"
      - "github.com/upper/db/v4"
      - "github.com/jmoiron/sqlx"
      - "github.com/go-pg/pg"
      # NoSQL Drivers
      - "go.mongodb.org/mongo-driver"
      - "github.com/go-redis/redis"
      - "github.com/segmentio/kafka-go"
      - "github.com/elastic/go-elasticsearch"
    system_type: "Database"
    actor_name: "Database"
    actor_description: "Go database system"

  - name: "Go Web Framework Detection"
    description: "Detect Go web framework usage"
    priority: 108
    patterns:
      # Web Frameworks
      - "github.com/gin-gonic/gin"
      - "github.com/labstack/echo"
      - "github.com/go-chi/chi"
      - "github.com/gofiber/fiber"
      - "github.com/gorilla/mux"
      - "github.com/valyala/fasthttp"
      - "net/http"
      - "github.com/urfave/negroni"
      - "github.com/pressly/chi"
    system_type: "WebServer"
    actor_name: "Web Server"
    actor_description: "Go web application server"

  - name: "Go gRPC Detection"
    description: "Detect Go gRPC usage"
    priority: 105
    patterns:
      # gRPC Libraries
      - "google.golang.org/grpc"
      - "github.com/grpc/grpc-go"
      # Protobuf
      - "google.golang.org/protobuf"
      - "github.com/golang/protobuf"
      # gRPC Gateway
      - "github.com/grpc-ecosystem/grpc-gateway"
    system_type: "APIFramework"
    actor_name: "gRPC Service"
    actor_description: "Go gRPC service"

  - name: "Go Testing Framework Detection"
    description: "Detect Go testing frameworks"
    priority: 95
    patterns:
      # Testing
      - "testing"
      - "github.com/stretchr/testify"
      - "github.com/golang/mock"
      - "github.com/gomock/gomock"
      # Test Coverage
      - "github.com/axw/gocov"
      - "github.com/AlekSi/gocov-xml"
    system_type: "Testing"
    actor_name: "Test Framework"
    actor_description: "Go testing framework"

  - name: "Go Build Tool Detection"
    description: "Detect Go build and dependency management"
    priority: 100
    patterns:
      # Go Modules
      - "go.mod"
      - "go.sum"
      # Build Tools
      - "go build"
      - "go run"
      - "go install"
      # Dependency Management
      - "go get"
      - "go mod"
    system_type: "BuildTool"
    actor_name: "Go Toolchain"
    actor_description: "Go build and dependency management"

  - name: "Go Microservice Framework Detection"
    description: "Detect Go microservice frameworks"
    priority: 102
    patterns:
      # Microservice Frameworks
      - "github.com/go-kit/kit"
      - "github.com/micro/go-micro"
      - "github.com/go-kratos/kratos"
      - "github.com/uber-go/fx"
      # Service Discovery
      - "github.com/hashicorp/consul/api"
      - "go.etcd.io/etcd"
      # Circuit Breaker
      - "github.com/sony/gobreaker"
    system_type: "MicroserviceFramework"
    actor_name: "Microservice Framework"
    actor_description: "Go microservice framework"

  - name: "Go Message Queue Detection"
    description: "Detect Go message queue systems"
    priority: 98
    patterns:
      # Message Queues
      - "github.com/segmentio/kafka-go"
      - "github.com/streadway/amqp"
      - "github.com/nsqio/go-nsq"
      - "github.com/go-redis/redis"
      - "github.com/nats-io/nats.go"
      # NATS Streaming
      - "github.com/nats-io/stan.go"
    system_type: "MessageQueue"
    actor_name: "Message Broker"
    actor_description: "Go messaging system"

# Go-specific container rules
containers:
  - name: "Go Web Application Container"
    description: "Detect Go web application containers"
    priority: 110
    framework_patterns:
      - "Gin"
      - "Echo"
      - "Chi"
      - "Fiber"
      - "Gorilla Mux"
    directory_patterns:
      - "cmd"
      - "internal"
      - "pkg"
      - "api"
      - "handler"
      - "server"
    file_patterns:
      - "main.go"
      - "server.go"
      - "router.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
    container_type: "Web Application"
    container_name: "Go Web App"
    technology: ["Go", "net/http", "Docker"]

  - name: "Go API Service Container"
    description: "Detect Go API service containers"
    priority: 108
    framework_patterns:
      - "Gin"
      - "Echo"
      - "Chi"
      - "gRPC"
      - "go-kit"
    directory_patterns:
      - "api"
      - "service"
      - "handler"
      - "endpoint"
      - "proto"
    file_patterns:
      - "api/"
      - "handler/"
      - "service/"
      - "endpoint/"
      - "*.proto"
    container_type: "API Service"
    container_name: "Go API"
    technology: ["Go", "REST", "gRPC"]

  - name: "Go CLI Tool Container"
    description: "Detect Go CLI application containers"
    priority: 105
    framework_patterns:
      - "cobra"
      - "urfave/cli"
      - "flag"
      - "pflag"
    directory_patterns:
      - "cmd"
      - "cli"
      - "command"
    file_patterns:
      - "cmd/"
      - "main.go"
      - "root.go"
      - "command.go"
    container_type: "CLI Application"
    container_name: "Go CLI"
    technology: ["Go", "Command Line"]

  - name: "Go Microservice Container"
    description: "Detect Go microservice containers"
    priority: 106
    framework_patterns:
      - "go-kit"
      - "go-micro"
      - "kratos"
      - "uber-go/fx"
    directory_patterns:
      - "cmd"
      - "internal"
      - "pkg"
      - "service"
      - "transport"
    file_patterns:
      - "main.go"
      - "service.go"
      - "endpoint.go"
      - "transport.go"
    container_type: "Microservice"
    container_name: "Go Microservice"
    technology: ["Go", "Microservices", "Docker"]

  - name: "Go Background Worker Container"
    description: "Detect Go background worker containers"
    priority: 95
    framework_patterns:
      - "asynq"
      - "machinery"
      - "kafka-go"
      - "amqp"
    directory_patterns:
      - "worker"
      - "job"
      - "task"
      - "processor"
    file_patterns:
      - "worker.go"
      - "processor.go"
      - "consumer.go"
      - "job.go"
    container_type: "Background Worker"
    container_name: "Go Worker"
    technology: ["Go", "Message Queue"]

  - name: "Go gRPC Service Container"
    description: "Detect Go gRPC service containers"
    priority: 107
    framework_patterns:
      - "grpc"
      - "protobuf"
      - "grpc-gateway"
    directory_patterns:
      - "api"
      - "proto"
      - "grpc"
      - "internal"
    file_patterns:
      - "*.proto"
      - "grpc/"
      - "server_grpc.go"
      - "client_grpc.go"
    container_type: "gRPC Service"
    container_name: "Go gRPC"
    technology: ["Go", "gRPC", "Protobuf"]

# Go-specific component rules
components:
  - name: "Go Handler Components"
    description: "Identify Go HTTP handler components"
    priority: 110
    entity_types: ["function", "struct", "interface"]
    importance_threshold: 0.6
    max_per_file: 5
    component_type: "Handler"
    name_patterns:
      - "*Handler"
      - "*HandlerFunc"
      - "*Controller"
      - "*Endpoint"
    file_patterns:
      - "handler/"
      - "handlers/"
      - "controller/"
      - "endpoint/"

  - name: "Go Service Components"
    description: "Identify Go service components"
    priority: 108
    entity_types: ["struct", "interface"]
    importance_threshold: 0.5
    max_per_file: 3
    component_type: "Service"
    name_patterns:
      - "*Service"
      - "*ServiceImpl"
      - "*Business"
      - "*Logic"
      - "*Manager"
    file_patterns:
      - "service/"
      - "services/"
      - "internal/service/"

  - name: "Go Model Components"
    description: "Identify Go model/struct components"
    priority: 105
    entity_types: ["struct"]
    importance_threshold: 0.4
    max_per_file: 10
    component_type: "Model"
    name_patterns:
      - "*Model"
      - "*Entity"
      - "*DTO"
      - "*Request"
      - "*Response"
      - "*Data"
    file_patterns:
      - "model/"
      - "models/"
      - "entity/"
      - "entities/"
      - "dto/"
      - "types/"

  - name: "Go Repository Components"
    description: "Identify Go repository components"
    priority: 106
    entity_types: ["struct", "interface"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Repository"
    name_patterns:
      - "*Repository"
      - "*Repo"
      - "*Store"
      - "*Persistence"
      - "*DAO"
    file_patterns:
      - "repository/"
      - "repositories/"
      - "storage/"
      - "data/"

  - name: "Go Middleware Components"
    description: "Identify Go middleware components"
    priority: 100
    entity_types: ["function", "struct"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Middleware"
    name_patterns:
      - "*Middleware"
      - "*MiddlewareFunc"
      - "*Filter"
      - "*Interceptor"
      - "*Wrapper"
    file_patterns:
      - "middleware/"
      - "middlewares/"
      - "filter/"

  - name: "Go gRPC Service Components"
    description: "Identify Go gRPC service components"
    priority: 107
    entity_types: ["struct", "interface"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "gRPC Service"
    name_patterns:
      - "*Server"
      - "*ServiceServer"
      - "*GRPC"
      - "*Grpc"
    file_patterns:
      - "grpc/"
      - "service/"
      - "internal/grpc/"

  - name: "Go Utility Components"
    description: "Identify Go utility components"
    priority: 85
    entity_types: ["function", "struct"]
    importance_threshold: 0.3
    max_per_file: 3
    component_type: "Utility"
    name_patterns:
      - "*Util"
      - "*Utils"
      - "*Helper"
      - "*Tool"
      - "*Common"
    file_patterns:
      - "util/"
      - "utils/"
      - "helper/"
      - "tools/"
      - "pkg/"

  - name: "Go Config Components"
    description: "Identify Go configuration components"
    priority: 88
    entity_types: ["struct", "function"]
    importance_threshold: 0.3
    max_per_file: 2
    component_type: "Configuration"
    name_patterns:
      - "*Config"
      - "*Configuration"
      - "*Settings"
      - "*Options"
      - "*Params"
    file_patterns:
      - "config/"
      - "conf/"
      - "settings/"
      - "internal/config/"

  - name: "Go Validator Components"
    description: "Identify Go validation components"
    priority: 92
    entity_types: ["function", "struct"]
    importance_threshold: 0.4
    max_per_file: 5
    component_type: "Validator"
    name_patterns:
      - "*Validator"
      - "*Validation"
      - "*Rule"
      - "*Checker"
      - "*Verifier"
    file_patterns:
      - "validator/"
      - "validation/"
      - "rules/"
      - "check/"

  - name: "Go Client Components"
    description: "Identify Go client components"
    priority: 95
    entity_types: ["struct", "interface"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Client"
    name_patterns:
      - "*Client"
      - "*Connector"
      - "*Gateway"
      - "*Proxy"
      - "*Adapter"
    file_patterns:
      - "client/"
      - "clients/"
      - "connector/"
      - "gateway/"

  - name: "Go Test Components"
    description: "Identify Go test components"
    priority: 90
    entity_types: ["function", "struct"]
    importance_threshold: 0.3
    max_per_file: 5
    component_type: "Test"
    name_patterns:
      - "Test*"
      - "Benchmark*"
      - "Example*"
    file_patterns:
      - "*_test.go"
