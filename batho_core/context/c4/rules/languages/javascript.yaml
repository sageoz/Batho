# JavaScript/Node.js-specific C4 Generation Rules

language: "javascript"
description: "Rules for JavaScript and Node.js applications including Express, React, and common npm packages"
file_extensions: [".js", ".jsx", ".mjs", ".cjs"]

# JavaScript-specific external system rules
external_systems:
  - name: "Node.js Database Detection"
    description: "Detect Node.js database systems and ORMs"
    priority: 110
    patterns:
      # ORMs
      - "mongoose"
      - "sequelize"
      - "typeorm"
      - "prisma"
      - "bookshelf"
      - "objection"
      - "knex"
      # Database Drivers
      - "pg"  # PostgreSQL
      - "mysql"
      - "mysql2"
      - "mongodb"
      - "redis"
      - "ioredis"
      - "cassandra-driver"
      - "elasticsearch"
      - "neo4j-driver"
      # NoSQL
      - "level"
      - "lmdb"
      - "nedb"
    system_type: "Database"
    actor_name: "Database"
    actor_description: "Node.js database system"

  - name: "Node.js Web Framework Detection"
    description: "Detect Node.js web framework usage"
    priority: 108
    patterns:
      # Web Frameworks
      - "express"
      - "koa"
      - "hapi"
      - "fastify"
      - "restify"
      - "sails"
      - "loopback"
      - "feathers"
      - "adonisjs"
      - "nuxt"
      - "next"
      # HTTP Libraries
      - "http"
      - "https"
      - "axios"
      - "node-fetch"
      - "got"
    system_type: "WebServer"
    actor_name: "Web Server"
    actor_description: "Node.js web application server"

  - name: "Node.js Testing Framework Detection"
    description: "Detect Node.js testing frameworks"
    priority: 95
    patterns:
      # Testing Frameworks
      - "jest"
      - "mocha"
      - "jasmine"
      - "qunit"
      - "tape"
      - "ava"
      - "cypress"
      - "playwright"
      # Test Runners
      - "karma"
      - "protractor"
      # Mocking
      - "sinon"
      - "testdouble"
      - "nock"
      # Assertion Libraries
      - "chai"
      - "should"
      - "expect"
      - "assert"
    system_type: "Testing"
    actor_name: "Test Framework"
    actor_description: "Node.js testing framework"

  - name: "Node.js Build Tool Detection"
    description: "Detect Node.js build and bundling tools"
    priority: 100
    patterns:
      # Build Tools
      - "webpack"
      - "rollup"
      - "parcel"
      - "vite"
      - "esbuild"
      - "snowpack"
      # Package Managers
      - "npm"
      - "yarn"
      - "pnpm"
      # Task Runners
      - "gulp"
      - "grunt"
      - "broccoli"
    system_type: "BuildTool"
    actor_name: "Build Tool"
    actor_description: "Node.js build and bundling tool"

  - name: "Node.js Microservice Framework Detection"
    description: "Detect Node.js microservice frameworks"
    priority: 102
    patterns:
      # Microservice Frameworks
      - "nest"
      - "nestjs"
      - "seneca"
      - "moleculer"
      - "micro"
      - "fastify"
      # Service Discovery
      - "consul"
      - "eureka-js-client"
      - "etcd3"
      # API Gateway
      - "express-gateway"
      - "kraken"
    system_type: "MicroserviceFramework"
    actor_name: "Microservice Framework"
    actor_description: "Node.js microservice framework"

  - name: "Node.js Real-time Detection"
    description: "Detect Node.js real-time communication libraries"
    priority: 98
    patterns:
      # Real-time Libraries
      - "socket.io"
      - "ws"  # WebSockets
      - "uws"
      - "sockjs"
      - "faye"
      # Message Queues
      - "bull"
      - "bee-queue"
      - "kue"
      - "agenda"
    system_type: "Realtime"
    actor_name: "Real-time Service"
    actor_description: "Node.js real-time communication service"

  - name: "Node.js Cloud Detection"
    description: "Detect Node.js cloud SDKs"
    priority: 90
    patterns:
      # AWS
      - "aws-sdk"
      - "@aws-sdk"
      # Google Cloud
      - "@google-cloud"
      - "gcloud"
      # Azure
      - "azure"
      - "@azure"
      # Other Cloud
      - "cloudflare"
      - "digitalocean"
      - "twilio"
      - "sendgrid"
    system_type: "CloudPlatform"
    actor_name: "Cloud Platform"
    actor_description: "Node.js cloud platform SDK"

# JavaScript-specific container rules
containers:
  - name: "Node.js Express Application"
    description: "Detect Express.js application containers"
    priority: 110
    framework_patterns:
      - "Express"
      - "express"
    directory_patterns:
      - "src"
      - "app"
      - "server"
      - "api"
      - "routes"
    file_patterns:
      - "app.js"
      - "server.js"
      - "index.js"
      - "main.js"
      - "package.json"
      - "routes.js"
      - "routes/"
    container_type: "Web Application"
    container_name: "Express App"
    technology: ["Node.js", "Express", "NPM"]

  - name: "Node.js API Service Container"
    description: "Detect Node.js API service containers"
    priority: 108
    framework_patterns:
      - "Express"
      - "Fastify"
      - "Koa"
      - "Hapi"
      - "Restify"
    directory_patterns:
      - "api"
      - "service"
      - "endpoint"
      - "rest"
      - "routes"
    file_patterns:
      - "api.js"
      - "routes.js"
      - "endpoints.js"
      - "controllers.js"
      - "handlers.js"
    container_type: "API Service"
    container_name: "Node.js API"
    technology: ["Node.js", "REST", "JSON"]

  - name: "Node.js NestJS Application"
    description: "Detect NestJS application containers"
    priority: 109
    framework_patterns:
      - "NestJS"
      - "nest"
      - "@nestjs"
    directory_patterns:
      - "src"
      - "app"
    file_patterns:
      - "main.ts"
      - "app.module.ts"
      - "package.json"
      - "nest-cli.json"
    container_type: "Web Application"
    container_name: "NestJS App"
    technology: ["Node.js", "TypeScript", "NestJS"]

  - name: "Node.js React Application"
    description: "Detect React application containers"
    priority: 105
    framework_patterns:
      - "React"
      - "react"
      - "create-react-app"
      - "Next.js"
      - "next"
      - "Gatsby"
      - "gatsby"
    directory_patterns:
      - "src"
      - "components"
      - "pages"
      - "public"
    file_patterns:
      - "App.js"
      - "index.js"
      - "package.json"
      - "next.config.js"
      - "gatsby-config.js"
    container_type: "Web Application"
    container_name: "React App"
    technology: ["JavaScript", "React", "SPA"]

  - name: "Node.js CLI Tool Container"
    description: "Detect Node.js CLI application containers"
    priority: 100
    framework_patterns:
      - "Commander.js"
      - "Yargs"
      - "Caporal"
      - "Vorpal"
      - "oclif"
    directory_patterns:
      - "bin"
      - "cli"
      - "cmd"
      - "scripts"
    file_patterns:
      - "cli.js"
      - "index.js"
      - "bin/"
      - "#!/usr/bin/env node"
    container_type: "CLI Application"
    container_name: "Node.js CLI"
    technology: ["Node.js", "Command Line"]

  - name: "Node.js Background Worker Container"
    description: "Detect Node.js background worker containers"
    priority: 95
    framework_patterns:
      - "Bull"
      - "Bee-Queue"
      - "Kue"
      - "Agenda"
    directory_patterns:
      - "worker"
      - "jobs"
      - "tasks"
      - "queue"
    file_patterns:
      - "worker.js"
      - "jobs.js"
      - "processor.js"
      - "queue.js"
    container_type: "Background Worker"
    container_name: "Node.js Worker"
    technology: ["Node.js", "Job Queue"]

  - name: "Node.js Static Site Container"
    description: "Detect Node.js static site generators"
    priority: 90
    framework_patterns:
      - "Gatsby"
      - "Next.js"
      - "Nuxt.js"
      - "SvelteKit"
      - "Astro"
      - "Eleventy"
      - "Hugo"
    directory_patterns:
      - "src"
      - "content"
      - "static"
      - "public"
    file_patterns:
      - "gatsby-config.js"
      - "next.config.js"
      - "nuxt.config.js"
      - "svelte.config.js"
    container_type: "Static Site"
    container_name: "Static Site"
    technology: ["JavaScript", "SSG", "Jamstack"]

# JavaScript-specific component rules
components:
  - name: "Express Route Components"
    description: "Identify Express route components"
    priority: 110
    entity_types: ["function", "class", "object"]
    importance_threshold: 0.6
    max_per_file: 5
    component_type: "Route Handler"
    name_patterns:
      - "router"
      - "route"
      - "get"
      - "post"
      - "put"
      - "delete"
      - "patch"
    file_patterns:
      - "routes.js"
      - "routes/"
      - "api.js"
      - "api/"

  - name: "React Components"
    description: "Identify React components"
    priority: 108
    entity_types: ["function", "class"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "React Component"
    name_patterns:
      - "*Component"
      - "*Container"
      - "*Page"
      - "*View"
      # React Hooks
      - "use*"
    file_patterns:
      - "components/"
      - "containers/"
      - "pages/"
      - "views/"
      - "*.jsx"

  - name: "Node.js Middleware Components"
    description: "Identify Node.js middleware components"
    priority: 105
    entity_types: ["function", "class"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Middleware"
    name_patterns:
      - "*Middleware"
      - "*Handler"
      - "*Filter"
      - "*Interceptor"
      # Express middleware patterns
      - "auth*"
      - "cors*"
      - "logger*"
      - "error*"
    file_patterns:
      - "middleware/"
      - "handlers/"
      - "filters/"

  - name: "Node.js Service Components"
    description: "Identify Node.js service components"
    priority: 100
    entity_types: ["class", "function", "object"]
    importance_threshold: 0.5
    max_per_file: 3
    component_type: "Service"
    name_patterns:
      - "*Service"
      - "*Service*"
      - "*Manager"
      - "*Handler"
      - "*Provider"
    file_patterns:
      - "services/"
      - "service/"
      - "lib/"
      - "utils/"

  - name: "Mongoose Model Components"
    description: "Identify Mongoose model components"
    priority: 102
    entity_types: ["object", "class"]
    importance_threshold: 0.4
    max_per_file: 10
    component_type: "Mongoose Model"
    name_patterns:
      - "*Model"
      - "*Schema"
      - "*Entity"
    file_patterns:
      - "models/"
      - "model/"
      - "schemas/"
      - "entities/"

  - name: "Sequelize Model Components"
    description: "Identify Sequelize model components"
    priority: 101
    entity_types: ["class", "object"]
    importance_threshold: 0.4
    max_per_file: 10
    component_type: "Sequelize Model"
    name_patterns:
      - "*Model"
      - "*Entity"
      - "*Instance"
    file_patterns:
      - "models/"
      - "model/"
      - "entities/"

  - name: "Node.js Controller Components"
    description: "Identify Node.js controller components"
    priority: 98
    entity_types: ["class", "function", "object"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Controller"
    name_patterns:
      - "*Controller"
      - "*Ctrl"
      - "*Handler"
      - "*Endpoint"
    file_patterns:
      - "controllers/"
      - "controller/"
      - "handlers/"

  - name: "Node.js Utility Components"
    description: "Identify Node.js utility components"
    priority: 85
    entity_types: ["function", "class", "object"]
    importance_threshold: 0.3
    max_per_file: 3
    component_type: "Utility"
    name_patterns:
      - "*Util"
      - "*Utils"
      - "*Helper"
      - "*Tool"
      - "*Common"
    file_patterns:
      - "utils/"
      - "util/"
      - "helpers/"
      - "lib/"
      - "common/"

  - name: "Node.js Config Components"
    description: "Identify Node.js configuration components"
    priority: 88
    entity_types: ["object", "class", "function"]
    importance_threshold: 0.3
    max_per_file: 2
    component_type: "Configuration"
    name_patterns:
      - "*Config"
      - "*Configuration"
      - "*Settings"
      - "*Options"
    file_patterns:
      - "config/"
      - "conf/"
      - "settings/"
      - "config.js"
      - "config.json"

  - name: "Node.js Socket Components"
    description: "Identify Socket.io components"
    priority: 92
    entity_types: ["function", "class", "object"]
    importance_threshold: 0.5
    max_per_file: 5
    component_type: "Socket Handler"
    name_patterns:
      - "*Socket"
      - "*Socket*"
      - "*Connection"
      - "*Listener"
      - "*Handler"
    file_patterns:
      - "sockets/"
      - "socket.js"
      - "io.js"
