version: "1.0"
registry_url: "registry.batho.io/lsp"

languages:
  python:
    name: "Python"
    lsp_name: "Pyright"
    versions:
      "1.1.350":
        container:
          base_image: "batho-lsp/base:node20-alpine"
          lsp_binary:
            source: "npm"
            package: "pyright"
            version: "1.1.350"
            sha256: "9c3c5ad2db9e34e7dd6d2fdb7afce4fc1dcaa86f2b1c416e3c0fcbb0195ee025" # Placeholder
          resources:
            memory_mb: 2048
            cpu_cores: 2
          command: ["pyright-langserver", "--stdio"]
          env:
            NODE_ENV: "production"
          patterns:
            - "*.py"
            - "*.pyi"
          config:
            type: "pyright"
            files:
              - "pyrightconfig.json"
              - "pyproject.toml"
          dependencies:
            - name: "node"
              version: "20.11.0"
              sha256: "sha256:dummy"
        verification:
          - type: "startup"
            timeout_ms: 10000
          - type: "initialize"
            test_file: "test_data/simple.py"
          - type: "definition"
            expected_result: "pass"
            
  typescript:
    name: "TypeScript"
    lsp_name: "TypeScript Language Server"
    versions:
      "4.3.3":
        container:
          base_image: "batho-lsp/base:node20-alpine"
          lsp_binary:
            source: "npm"
            package: "typescript-language-server"
            version: "4.3.3"
            sha256: "b2c3d4e5f6a7d8e9f0"
          command: ["typescript-language-server", "--stdio"]
          patterns:
            - "*.ts"
            - "*.tsx"
            - "*.js"
            - "*.jsx"
          config:
            type: "typescript"
            files:
              - "tsconfig.json"
              - "jsconfig.json"
            dependencies:
              - name: "node"
                version: "20.11.0"
                sha256: "b2c3d4e5f6a7d8e9f0"
          verification:
            - type: "startup"
              timeout_ms: 10000
            - type: "initialize"
              test_file: "test_data/simple.ts"
            - type: "definition"
              expected_result: "pass"

  go:
    name: "Go"
    lsp_name: "gopls"
    versions:
      "0.15.3":
        container:
          base_image: "batho-lsp/base:go1.22-alpine"
          lsp_binary:
            source: "go"
            package: "golang.org/x/tools/gopls"
            version: "0.15.3"
            sha256: "cae4ccbb23114bddee6b31e9c9a0de24f603a11fa927514afbd2b2123f1a21e7"
          command: ["gopls", "-mode=stdio"]
          patterns:
            - "*.go"
          config:
            type: "go"
            files:
              - "go.mod"
              - "go.sum"
          resources:
            memory_mb: 2048
            cpu_cores: 2
        verification:
          - type: "startup"
            timeout_ms: 15000
          - type: "initialize"
            test_file: "test_data/simple.go"
          - type: "definition"
            expected_result: "pass"

  rust:
    name: "Rust"
    lsp_name: "rust-analyzer"
    versions:
      "2024-02-12":
        container:
          base_image: "batho-lsp/base:rust1.76-alpine"
          lsp_binary:
            source: "github"
            package: "rust-lang/rust-analyzer"
            version: "2024-02-12"
            sha256: "c1deb010a3075253fd66a59604df0f7dbb2520ab40742a03cf65ae71bfa2b354"
          command: ["rust-analyzer"]
          patterns:
            - "*.rs"
          config:
            type: "cargo"
            files:
              - "Cargo.toml"
              - "Cargo.lock"
          resources:
            memory_mb: 4096
            cpu_cores: 4
        verification:
          - type: "startup"
            timeout_ms: 20000
          - type: "initialize"
            test_file: "test_data/simple.rs"

  java:
    name: "Java"
    lsp_name: "Eclipse JDT LS"
    versions:
      "1.31.0":
        container:
          base_image: "batho-lsp/base:jdk17-alpine"
          lsp_binary:
            source: "eclipse"
            package: "jdtls"
            version: "1.31.0"
            sha256: "723b49ee161b97950bd16fdcacd73f4ee2bed2e38c92b23605defc6d2dff1bba"
          command: [
            "java",
            "-Declipse.application=org.eclipse.jdt.ls.core.id1",
            "-Dosgi.bundles.defaultStartLevel=4",
            "-Declipse.product=org.eclipse.jdt.ls.core.product",
            "-Dlog.level=ALL",
            "-noverify",
            "-Xmx1G",
            "-jar", "/opt/jdtls/plugins/org.eclipse.equinox.launcher_1.6.400.v20210924-0641.jar",
            "-configuration", "/opt/jdtls/config_linux",
            "-data", "/workspace/.metadata"
          ]
          patterns:
            - "*.java"
          config:
            type: "java"
            files:
              - "pom.xml"
              - "build.gradle"
          resources:
            memory_mb: 4096
            cpu_cores: 4
        verification:
          - type: "startup"
            timeout_ms: 30000
          - type: "initialize"
            test_file: "test_data/simple.java"

  cpp:
    name: "C/C++"
    lsp_name: "clangd"
    versions:
      "17.0.3":
        container:
          base_image: "batho-lsp/base:llvm17-alpine"
          lsp_binary:
            source: "llvm"
            package: "clangd"
            version: "17.0.3"
            sha256: "ab26bc2dc1ac9a5b3aada1508ef8cf1bd14d643fe7d0c3ebbbdfdc004a434b9d"
          command: ["clangd", "--log=verbose"]
          patterns:
            - "*.c"
            - "*.cc"
            - "*.cpp"
            - "*.cxx"
            - "*.h"
            - "*.hpp"
            - "*.hxx"
          config:
            type: "compile_commands"
            files:
              - "compile_commands.json"
              - "CMakeLists.txt"
          resources:
            memory_mb: 4096
            cpu_cores: 4
        verification:
          - type: "startup"
            timeout_ms: 10000
          - type: "initialize"
            test_file: "test_data/simple.cpp"

