schema_version: bsg-plugin.v1
plugin_id: bsg_nplus1_query_catcher
name: N+1 Query Catcher
version: 1.0.0
enabled: true
description: Flag database execution patterns likely occurring inside loop structures.
rules:
  - rule_id: nplus1-query-risk
    name: nplus1-query-risk
    description: Detect database execution nodes contained within loops.
    severity: warning
    priority: 310
    enabled: true
    matchers:
      usn_tags_any:
        - databaseexecution
      ast_edges:
        all:
          - edge: CONTAINED_WITHIN
            direction: outbound
            target_usn_tags_any:
              - loopstatement
            min_count: 1
    actions:
      metadata:
        bsg.intercept.category: PERFORMANCE
        bsg.intercept.message: Database execution appears inside a loop; evaluate batching or join-based rewrite.
      add_usn_tags:
        - PerformanceSensitive
