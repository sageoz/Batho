# BSG Autoresearch v1 — Repository Seed Set
# 10 multi-language, moderate-sized OSS repos for convention mining.

repositories:
  - name: flask
    url: https://github.com/pallets/flask.git
    branch: main
    language: python
    framework_tags: [web, micro-framework]
    include_globs: ["**/*.py"]
    exclude_globs: ["tests/**", "docs/**", "examples/**"]

  - name: fastapi
    url: https://github.com/tiangolo/fastapi.git
    branch: master
    language: python
    framework_tags: [web, async, api]
    include_globs: ["**/*.py"]
    exclude_globs: ["tests/**", "docs/**", "scripts/**"]

  - name: express
    url: https://github.com/expressjs/express.git
    branch: master
    language: javascript
    framework_tags: [web, middleware]
    include_globs: ["**/*.js"]
    exclude_globs: ["test/**", "benchmarks/**"]

  - name: nest
    url: https://github.com/nestjs/nest.git
    branch: master
    language: typescript
    framework_tags: [web, di, modular]
    include_globs: ["**/*.ts"]
    exclude_globs: ["tests/**", "integration/**", "sample/**", "tools/**"]

  - name: gin
    url: https://github.com/gin-gonic/gin.git
    branch: master
    language: go
    framework_tags: [web, router, middleware]
    include_globs: ["**/*.go"]
    exclude_globs: ["_test.go", "testdata/**", "examples/**", "fixtures/**"]

  - name: spring-petclinic
    url: https://github.com/spring-projects/spring-petclinic.git
    branch: main
    language: java
    framework_tags: [web, spring, mvc]
    include_globs: ["**/*.java"]
    exclude_globs: ["src/test/**"]

  - name: eShopOnWeb
    url: https://github.com/dotnet-architecture/eShopOnWeb.git
    branch: main
    language: csharp
    framework_tags: [web, architecture, ddd]
    include_globs: ["**/*.cs"]
    exclude_globs: ["**/*Test*/**", "**/*test*/**"]

  - name: laravel
    url: https://github.com/laravel/laravel.git
    branch: master
    language: php
    framework_tags: [web, mvc, eloquent]
    include_globs: ["**/*.php"]
    exclude_globs: ["tests/**", "vendor/**", "storage/**"]

  - name: sinatra
    url: https://github.com/sinatra/sinatra.git
    branch: main
    language: ruby
    framework_tags: [web, dsl, routing]
    include_globs: ["**/*.rb"]
    exclude_globs: ["test/**", "spec/**"]

  - name: axum
    url: https://github.com/tokio-rs/axum.git
    branch: main
    language: rust
    framework_tags: [web, async, tower]
    include_globs: ["**/*.rs"]
    exclude_globs: ["**/*test*", "examples/**", "benchmarks/**"]
