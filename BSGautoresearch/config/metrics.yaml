# BSG Autoresearch v1 — Metrics Configuration
# Weighted scoring formula + hard acceptance gates.

weights:
  coverage: 0.35
  precision_proxy: 0.25
  holdout_generalization: 0.20
  determinism: 0.10
  runtime_efficiency: 0.10

hard_gates:
  schema_valid: true                  # candidate must pass bsg-plugin-schema-v1.json
  deterministic_stable: true          # same rule_ids + same top-line stats on rerun
  no_holdout_regression: true         # holdout score must not drop vs best
  max_runtime_overhead_pct: 20        # <= +20% vs baseline runtime
  max_touched_entity_ratio: 0.30      # no rule explosion: <= 30% of entities touched
