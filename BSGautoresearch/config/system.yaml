# BSG Autoresearch v1 — System Configuration
# Immutable runtime paths, limits, and execution budgets.

clone_root: ./repos              # relative to BSGautoresearch/ or absolute
max_repo_size_mb: 500
max_files: 200000
max_single_file_mb: 10
git_clone_depth: 1
iteration_timeout_sec: 600
max_iterations: 3
batho_root: ..                   # relative to BSGautoresearch/ → Batho repo root
candidate_plugin_target: batho/bsg/plugins/autoresearch/bsg_autoresearch_generated.yaml

llm:
  enabled: true
  provider: openrouter
  api_base: https://openrouter.ai/api/v1
  model: z-ai/glm-5.1
  api_key_env: OPENROUTER_API_KEY
  temperature: 0.0
  max_tokens: 1400
  timeout_sec: 60
  max_signals: 8
  site_url: https://github.com/batho/batho
  app_name: batho-bsg-autoresearch
