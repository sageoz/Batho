# Example BSG plugin fixture.
# Runner: `batho plugins test --fixture tests/bsg_plugins/secret_catcher.yaml`
#
# The fixture loads the packaged `bsg_hardcoded_secret_catcher` plugin,
# constructs a synthetic graph containing a variable named `API_PASSWORD`,
# and asserts that the plugin tags it with the expected metadata.

name: hardcoded-secret-catcher-flags-api-password
plugin:
  builtin: bsg_hardcoded_secret_catcher
given:
  entities:
    - type: variable
      name: API_PASSWORD
      file: src/config.py
      start_line: 1
      end_line: 1
      signature: "API_PASSWORD = 'super-secret'"
      metadata:
        language: python
    - type: function
      name: render_home
      file: src/views/home.py
      start_line: 1
      end_line: 8
      metadata:
        language: python
  relationships: []
expect:
  entity:
    - name: API_PASSWORD
      metadata:
        bsg.intercept.category: SECURITY
      usn_tags_include:
        - SecretCandidate
      rules_include:
        - likely-hardcoded-secret
    - name: render_home
      metadata_absent:
        - bsg.intercept.category
  rules_applied_includes:
    - likely-hardcoded-secret
  rules_applied_excludes:
    - silent-failure-risk
  min_rules_applied: 1
