# Sample INI configuration file

[app]
name = Sample Application
version = 1.0.0
debug = true
port = 8080

[database]
host = localhost
port = 5432
name = sample_db
user = admin
password = secret
ssl_enabled = true
pool_size = 10

[redis]
host = localhost
port = 6379
db = 0
timeout = 5000

[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

[logging.handlers.console]
type = console
level = INFO

[logging.handlers.file]
type = file
level = DEBUG
filename = app.log
max_size = 10MB
backup_count = 5

[features]
new_ui_enabled = true
beta_api_enabled = false

[server]
host = 0.0.0.0
workers = 4
max_connections = 1000
timeout = 30

[security]
jwt_secret = your-secret-key-here
jwt_expiration = 3600
cors_origins = http://localhost:3000,https://example.com

[security.rate_limit]
requests_per_minute = 60
burst_size = 10

[cache]
type = redis
ttl = 3600
max_size = 1000

[monitoring]
metrics_enabled = true
health_check_endpoint = /health
prometheus_port = 9090
