# Complex YAML with anchors and references
default: &default
  timeout: 30
  retries: 3
  backoff: 2

development:
  <<: *default
  database:
    host: "localhost"
    port: 5432
  debug: true

production:
  <<: *default
  database:
    host: "prod-db.example.com"
    port: 5432
    ssl: true
  debug: false
  monitoring:
    enabled: true
    endpoint: "https://metrics.example.com"
    alerts:
      - type: "email"
        recipients: ["admin@example.com"]
      - type: "slack"
        webhook: "https://hooks.slack.com/webhook"

services:
  web:
    image: "nginx:latest"
    ports:
      - "80:80"
      - "443:443"
    environment:
      NODE_ENV: "production"
      API_URL: "https://api.example.com"
  
  api:
    image: "node:18"
    ports:
      - "3000:3000"
    depends_on:
      - database
    environment: &api-env
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://user:pass@db:5432/app"
  
  worker:
    image: "node:18"
    environment:
      <<: *api-env
      WORKER_TYPE: "background"
