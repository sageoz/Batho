[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "batho"
version = "0.1.3"
description = "Enterprise-ready, high-speed, multi-language code indexer with BSG compression and Time Machine snapshots/diffs — no LLM required."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Batho", email = "hello@batho.dev" },
]
keywords = ["code-indexer", "bsg", "ast", "tree-sitter", "code-graph", "static-analysis", "code-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
]
urls = { homepage = "https://batho.dev", repository = "https://github.com/batho/batho", issues = "https://github.com/batho/batho/issues" }
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=0.6.0,<1.0.0",
    "pydantic>=2.10.0",
    "jsonschema>=4.23.0",
    "structlog>=25.1.0",
    "pathspec>=0.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.3.0",
]

[project.scripts]
batho = "batho_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["batho"]

[tool.hatch.build.targets.wheel.force-include]
"batho_cli.py" = "batho_cli.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may use disk/subprocess)",
    "slow: Slow tests (large repos, performance benchmarks)",
]

[tool.coverage.run]
source = ["batho", "batho_cli"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 0

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "vulture>=2.15",
    "pre-commit>=4.0.0",
]
