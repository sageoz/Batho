[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "batho"
version = "1.4.3"
description = "Enterprise-grade multi-language source code indexer and semantic code intelligence engine powered by tree-sitter AST parsing, BSG compression, and relational code graph snapshots."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Sageoz Team", email = "hello@sageoz.org" },
]
keywords = [
    "code-indexer",
    "semantic-code-intelligence",
    "tree-sitter-parser",
    "abstract-syntax-tree",
    "static-analysis-tool",
    "code-graph",
    "program-analysis",
    "source-code-indexer",
    "developer-tools",
    "bsg-compression",
    "metadata-extractor",
    "code-dependency-analysis",
    "refactoring-tool"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
urls = { homepage = "https://batho.sageoz.org", repository = "https://github.com/sageoz/batho", issues = "https://github.com/sageoz/batho/issues" }
dependencies = [
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.14.3",
    "pydantic==2.13.4",
    "jsonschema==4.26.0",
    "structlog==26.1.0",
    "pathspec==1.1.1",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "msgpack==1.1.2",
    "orjson==3.11.9",
    "zstandard==0.25.0",
    "psutil==7.2.2",
    "pyarrow==24.0.0",
    "numpy==2.4.6",
    "fastmcp==3.4.7",
    "networkx==3.6.1",
    "watchdog==6.0.0",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "httpx==0.28.1",
]

[project.scripts]
batho = "batho_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["batho"]

[tool.hatch.build.targets.wheel.force-include]
"batho_cli.py" = "batho_cli.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "docs-site/",
    "docs/",
    "benchmarks/",
    "cicd/",
    "assets/",
    ".github/",
    ".devin/",
    ".windsurf/",
    "batho.yaml",
    "batho.yaml.example",
    "SKILL.md",
    ".python-version",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may use disk/subprocess)",
    "slow: Slow tests (large repos, performance benchmarks)",
]

[tool.coverage.run]
source = ["batho", "batho_cli"]
omit = [
    "tests/*",
    ".venv/*",
    "adaptors/*",
    "batho/adaptors/*",
    "tests/bridge/*"
]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 60

[dependency-groups]
dev = [
    "black==26.5.1",
    "isort==8.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "vulture==2.16",
    "pre-commit==4.6.0",
]
