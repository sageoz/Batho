[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "batho"
version = "1.2.0"
description = "Enterprise-grade multi-language source code indexer and semantic code intelligence engine powered by tree-sitter AST parsing, BSG compression, and relational code graph snapshots."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Sageoz Team", email = "hello@sageoz.org" },
]
keywords = [
    "code-indexer",
    "semantic-code-intelligence",
    "tree-sitter-parser",
    "abstract-syntax-tree",
    "static-analysis-tool",
    "code-graph",
    "program-analysis",
    "source-code-indexer",
    "developer-tools",
    "bsg-compression",
    "metadata-extractor",
    "code-dependency-analysis",
    "refactoring-tool"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
urls = { homepage = "https://batho.sageoz.org", repository = "https://github.com/sageoz/batho", issues = "https://github.com/sageoz/batho/issues" }
dependencies = [
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=0.6.0,<1.0.0",
    "pydantic>=2.10.0",
    "jsonschema>=4.23.0",
    "structlog>=25.1.0",
    "pathspec>=0.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "msgpack>=1.0.8",
    "orjson>=3.10.0",
    "zstandard>=0.22.0",
    "psutil>=7.2.2",
    "pyarrow>=14.0",
    "numpy>=1.26.0",
    "fastmcp>=2.14.0",
    "leidenalg>=0.10",
    "python-igraph>=0.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
batho = "batho_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["batho"]

[tool.hatch.build.targets.wheel.force-include]
"batho_cli.py" = "batho_cli.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (may use disk/subprocess)",
    "slow: Slow tests (large repos, performance benchmarks)",
]

[tool.coverage.run]
source = ["batho", "batho_cli"]
omit = [
    "tests/*",
    ".venv/*",
    "adaptors/*",
    "batho/adaptors/*",
    "tests/bridge/*"
]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 60

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "vulture>=2.15",
    "pre-commit>=4.0.0",
]
