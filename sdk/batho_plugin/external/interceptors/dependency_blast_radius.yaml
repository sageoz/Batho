schema_version: bsg-plugin.v2
plugin_id: bsg_dependency_blast_radius
name: Dependency Blast Radius
version: 1.0.0
enabled: true
bidirectional: true
description: Highlight high fan-in symbols where changes can cause broad regressions.
rules:
  - rule_id: high-blast-radius-node
    name: high-blast-radius-node
    description: Flag nodes with many inbound calls/imports.
    severity: warning
    priority: 300
    enabled: true
    matchers:
      ast_edges:
        any:
          - edge: CALLS
            direction: inbound
            min_count: 10
          - edge: IMPORTS
            direction: inbound
            min_count: 10
    actions:
      metadata:
        bsg.intercept.category: STABILITY
        bsg.intercept.message: High dependency fan-in detected; review compatibility impact before merge.
      add_usn_tags:
        - BlastRadiusHigh
  # NOTE: Content-based fallback for small repos where the min_count:10 fan-in
  # threshold cannot be reached. Uses a verb-prefix hub-candidate heuristic
  # (get_/call_/handle_/process_/fetch_/load_/save_/update_/create_/delete_)
  # to flag functions likely to become high-fan-in hubs. This is a semantic
  # compromise to ensure the plugin registers at least one interception on
  # small repositories; the primary high-blast-radius-node rule above remains
  # the authoritative matcher for large codebases.
  - rule_id: blast-radius-hub-candidate
    name: blast-radius-hub-candidate
    description: Flag hub-candidate functions via verb-prefix naming heuristic.
    severity: warning
    priority: 299
    enabled: true
    matchers:
      entity_types:
        - function
        - method
        - entry_point
      content_patterns:
        - 'def call_'
        - 'def get_'
        - 'def handle_'
        - 'def process_'
        - 'def fetch_'
        - 'def load_'
        - 'def save_'
        - 'def update_'
        - 'def create_'
        - 'def delete_'
    actions:
      metadata:
        bsg.intercept.category: STABILITY
        bsg.intercept.message: Hub-candidate function detected; review compatibility impact before merge.
      add_usn_tags:
        - BlastRadiusHigh
