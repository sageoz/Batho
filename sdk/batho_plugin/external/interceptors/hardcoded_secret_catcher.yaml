schema_version: bsg-plugin.v2
plugin_id: bsg_hardcoded_secret_catcher
name: Hardcoded Secret Catcher
version: 1.0.0
enabled: true
description: Flag likely hardcoded secret-bearing symbols in code.
rules:
  - rule_id: likely-hardcoded-secret
    name: likely-hardcoded-secret
    description: Detect variable/constant names that commonly hold secrets.
    severity: block
    priority: 350
    enabled: true
    matchers:
      entity_types:
        - variable
        - constant
        - field
      name_patterns:
        - '*secret*'
        - '*token*'
        - '*apikey*'
        - '*api_key*'
        - '*api_secret*'
        - '*password*'
        - '*passwd*'
        - '*pwd*'
        - '*access_key*'
        - '*accesskey*'
        - '*credential*'
        - '*private_key*'
        - '*privatekey*'
        - '*auth_token*'
        - '*bearer*'
    actions:
      metadata:
        bsg.intercept.category: SECURITY
        bsg.intercept.message: Potential hardcoded secret pattern detected; move to secure env/secret storage.
      add_usn_tags:
        - SecretCandidate
  - rule_id: hardcoded-secret-content-pattern
    name: hardcoded-secret-content-pattern
    description: Detect hardcoded secret assignment patterns in file content.
    severity: block
    priority: 349
    enabled: true
    matchers:
      entity_types:
        - function
        - method
        - entry_point
        - module
        - class
        - syntax_glue
      content_patterns:
        - 'api_key ='
        - 'api_secret ='
        - 'secret_token ='
        - 'aws_access_key ='
        - 'auth_token ='
        - 'private_key ='
        - 'password ='
        - 'db_password ='
        - 'apikey ='
        - 'sk-'
        - 'ghp_'
        - 'AKIA'
        - 'BEGIN PRIVATE KEY'
        - 'BEGIN RSA PRIVATE KEY'
    actions:
      metadata:
        bsg.intercept.category: SECURITY
        bsg.intercept.message: Hardcoded secret assignment detected in file content; move to secure env/secret storage.
      add_usn_tags:
        - SecretCandidate
