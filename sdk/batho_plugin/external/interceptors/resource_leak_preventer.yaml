schema_version: bsg-plugin.v2
plugin_id: bsg_resource_leak_preventer
name: Resource Leak Preventer
version: 1.0.0
enabled: true
description: Ensure resource allocations have cleanup paths.
rules:
  - rule_id: missing-resource-cleanup
    name: missing-resource-cleanup
    description: Flag resource allocations with no cleanup edges.
    severity: warning
    priority: 305
    enabled: true
    matchers:
      usn_tags_any:
        - resourceallocation
      ast_edges:
        any:
          - edge: CLEANED_BY
            direction: outbound
            min_count: 1
    actions:
      metadata:
        bsg.intercept.category: RELIABILITY
        bsg.intercept.message: Resource allocation detected; verify deterministic cleanup behavior.
      add_usn_tags:
        - CleanupCritical
  - rule_id: resource-allocation-content
    name: resource-allocation-content
    description: Detect resource allocation patterns via file content matching.
    severity: warning
    priority: 304
    enabled: true
    matchers:
      entity_types:
        - function
        - method
        - entry_point
      content_patterns:
        - 'sqlite3.connect('
        - 'open('
        - 'socket.socket('
        - 'subprocess.Popen('
        - 'psycopg2.connect('
        - 'mysql.connector.connect('
        - 'redis.Redis('
        - 'pymongo.MongoClient('
        - 'connect('
        - 'acquire('
        - 'allocate('
        - 'fopen('
        - 'File.open('
        - 'os.Open('
        - 'new FileInputStream('
        - 'new SqlConnection('
    actions:
      metadata:
        bsg.intercept.category: RELIABILITY
        bsg.intercept.message: Resource allocation detected via file content; verify deterministic cleanup behavior.
      add_usn_tags:
        - CleanupCritical
