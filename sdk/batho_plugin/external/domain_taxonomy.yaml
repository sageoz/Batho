        bsg.gen.reason: "L0 domain-tier community feed"
        bsg.domain: orchestrator

  - rule_id: domain-mcp
    name: domain-mcp
    description: batho/mcp/ — MCP server + tools
    severity: info
    priority: 100
    enabled: true
    matchers:
      file_patterns: ['batho/mcp/**']
    actions:
      metadata:
        bsg.generated: true
        bsg.gen.reason: "L0 domain-tier community feed"
        bsg.domain: mcp-server

  - rule_id: domain-utils
