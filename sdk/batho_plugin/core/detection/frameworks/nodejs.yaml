  # State management
  - rule_id: detect-redux
    name: Redux State Management
    description: Detect Redux state management
    severity: info
    priority: 340
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"redux"'
        - '"@reduxjs/toolkit"'
    actions:
      detect_framework:
        language: Node.js
        framework: Redux

  - rule_id: detect-zustand
    name: Zustand State Management
    description: Detect Zustand state management
    severity: info
    priority: 330
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"zustand"'
    actions:
      detect_framework:
        language: Node.js
        framework: Zustand

  # UI libraries
  - rule_id: detect-tailwind
    name: Tailwind CSS
    description: Detect Tailwind CSS framework
    severity: info
    priority: 320
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"tailwindcss"'
    actions:
      detect_framework:
        language: Node.js
        framework: Tailwind CSS

  - rule_id: detect-mui
    name: Material UI
    description: Detect Material UI component library
    severity: info
    priority: 310
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"@mui/material"'
        - '"@material-ui/core"'
    actions:
      detect_framework:
        language: Node.js
        framework: Material UI

  # Database/ORM
  - rule_id: detect-prisma
    name: Prisma ORM
    description: Detect Prisma ORM
    severity: info
    priority: 300
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"prisma"'
        - '"@prisma/client"'
    actions:
      detect_framework:
        language: Node.js
        framework: Prisma

  - rule_id: detect-typeorm
    name: TypeORM
    description: Detect TypeORM
    severity: info
    priority: 290
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"typeorm"'
    actions:
      detect_framework:
        language: Node.js
        framework: TypeORM
