schema_version: bsg-plugin.v2
plugin_id: bsg_framework_nodejs
name: BSG Node.js Framework Detection
version: 1.0.0
enabled: true
description: Detect Node.js frameworks from package.json content patterns.

rules:
  # Frontend frameworks
  - rule_id: detect-react
    name: React Framework
    description: Detect React frontend framework
    severity: info
    priority: 500
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"react"'
        - '"react-dom"'
    actions:
      detect_framework:
        language: Node.js
        framework: React

  - rule_id: detect-vue
    name: Vue.js Framework
    description: Detect Vue.js frontend framework
    severity: info
    priority: 490
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"vue"'
        - '"@vue/core"'
    actions:
      detect_framework:
        language: Node.js
        framework: Vue.js

  - rule_id: detect-angular
    name: Angular Framework
    description: Detect Angular frontend framework
    severity: info
    priority: 480
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"angular"'
        - '"@angular/core"'
    actions:
      detect_framework:
        language: Node.js
        framework: Angular

  - rule_id: detect-svelte
    name: Svelte Framework
    description: Detect Svelte frontend framework
    severity: info
    priority: 470
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"svelte"'
    actions:
      detect_framework:
        language: Node.js
        framework: Svelte

  # Backend frameworks
  - rule_id: detect-express
    name: Express Framework
    description: Detect Express backend framework
    severity: info
    priority: 460
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"express"'
    actions:
      detect_framework:
        language: Node.js
        framework: Express

  - rule_id: detect-fastify
    name: Fastify Framework
    description: Detect Fastify backend framework
    severity: info
    priority: 450
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"fastify"'
    actions:
      detect_framework:
        language: Node.js
        framework: Fastify

  - rule_id: detect-nestjs
    name: NestJS Framework
    description: Detect NestJS backend framework
    severity: info
    priority: 440
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"nest"'
        - '"@nestjs/core"'
    actions:
      detect_framework:
        language: Node.js
        framework: NestJS

  # Meta frameworks
  - rule_id: detect-nextjs
    name: Next.js Framework
    description: Detect Next.js meta framework
    severity: info
    priority: 430
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"next"'
    actions:
      detect_framework:
        language: Node.js
        framework: Next.js

  - rule_id: detect-nuxt
    name: Nuxt.js Framework
    description: Detect Nuxt.js meta framework
    severity: info
    priority: 420
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"nuxt"'
    actions:
      detect_framework:
        language: Node.js
        framework: Nuxt.js

  - rule_id: detect-remix
    name: Remix Framework
    description: Detect Remix meta framework
    severity: info
    priority: 410
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
      content_patterns:
        - '"remix"'
        - '"@remix-run/react"'
    actions:
      detect_framework:
        language: Node.js
        framework: Remix

  # Testing
  - rule_id: detect-jest
    name: Jest Testing Framework
    description: Detect Jest testing framework
    severity: info
    priority: 400
