  # TypeScript
  - rule_id: detect-typescript
    name: TypeScript
    description: Detect TypeScript
    severity: info
    priority: 350
    enabled: true
    matchers:
      file_patterns:
        - '**/package.json'
        - '**/tsconfig.json'
      content_patterns:
        - '"typescript"'
