# Pruning policy (class: core) — prunable method names for the graph builder's
# conservative stub pruning (_should_prune_stub, codegraph.py:2820-2855).
# Migrated verbatim from codegraph.py:1138-1160 (_PRUNABLE_METHOD_NAMES).
# Consumer: T18 wires CodeGraphIndexer._should_prune_stub to this data via the
# host; values become user-tunable without engine code changes (spec goal 3).
plugin_id: pruning-policy
version: "1.0.0"
class: core
requires:
  - batho_plugin.core
data:
  sets:
    prunable_methods:
      # Rust — Option/Result/Iterator/Vec/String/convert methods
      - "unwrap"
      - "unwrap_or"
      - "unwrap_or_else"
      - "expect"
      - "clone"
      - "into"
      - "as_ref"
      - "as_mut"
      - "to_owned"
      - "to_string"
      - "map"
      - "map_err"
      - "and_then"
      - "or"
      - "ok"
      - "err"
      - "is_some"
      - "is_none"
      - "is_ok"
      - "is_err"
      - "iter"
      - "into_iter"
      - "next"
      - "collect"
      - "filter"
      - "fold"
      - "for_each"
      - "enumerate"
      - "zip"
      - "len"
      - "is_empty"
      - "get"
      - "push"
      - "pop"
      - "insert"
      - "remove"
      - "contains"
      - "clear"
      - "extend"
      - "copied"
      - "cloned"
      - "take"
      - "skip"
      - "rev"
      - "chain"
      - "flat_map"
      - "filter_map"
      - "any"
      - "all"
      - "count"
      - "sum"
      - "min"
      - "max"
      - "peekable"
      - "dedup"
      # JavaScript — Array/String/Promise methods
      - "then"
      - "catch"
      - "finally"
      - "reduce"
      - "forEach"
      - "slice"
      - "splice"
      - "concat"
      - "join"
      - "split"
      - "replace"
      - "trim"
      - "includes"
      - "indexOf"
      - "find"
      - "findIndex"
      - "some"
      - "every"
      - "flat"
      - "flatMap"
      - "sort"
      - "reverse"
      - "fill"
      - "keys"
      - "values"
      - "entries"
      - "charAt"
      - "charCodeAt"
      - "substring"
      - "toLowerCase"
      - "toUpperCase"
      - "padStart"
      - "padEnd"
      - "repeat"
      - "startsWith"
      - "endsWith"
      - "normalize"
      # Python — list/dict/set/str methods
      - "append"
      - "copy"
      - "index"
      - "items"
      - "update"
      - "setdefault"
      - "popitem"
      - "fromkeys"
      - "add"
      - "discard"
      - "union"
      - "intersection"
      - "difference"
      - "symmetric_difference"
      - "issubset"
      - "issuperset"
      - "format"
      - "encode"
      - "decode"
      - "strip"
      - "lstrip"
      - "rstrip"
      - "partition"
      - "rpartition"
      - "rsplit"
      - "splitlines"
      - "swapcase"
      - "title"
      - "zfill"
      - "isalpha"
      - "isdigit"
      - "isalnum"
      - "isupper"
      - "islower"
      - "isspace"
