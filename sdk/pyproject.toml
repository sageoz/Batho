[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "batho-plugin-sdk"
version = "0.1.0"
description = "Pluggable plugin service module for the Batho engine: stage hooks, data plugins, PluginHost, and the YAML rule engine."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sageoz Team", email = "hello@sageoz.org" },
]
keywords = [
    "batho",
    "plugin-sdk",
    "code-intelligence",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The contract surface (stages/context/api/host/fingerprint/telemetry/hooks)
# is dependency-free; the rule engine (Tier-3 backend, T05) adds the YAML and
# JSON-Schema stack, pinned to the engine's versions.
dependencies = [
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[tool.hatch.build.targets.wheel]
# Package lives inside this member directory (standard workspace layout);
# the import path stays top-level `batho_plugin` — no import churn.
packages = ["batho_plugin"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "pyproject.toml",
    "batho_plugin/",
]
