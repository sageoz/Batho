<svg xmlns="http://www.w3.org/2000/svg" viewBox="132 132 336 336" width="336" height="336">
  <defs>
    <linearGradient id="b1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="b2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="b3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="b4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="b5" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="b6" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rotating blades -->
  <g transform="translate(300,300)" filter="url(#glow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <path d="M 0,0 C -15,-50 -60,-120 -10,-155 C 15,-140 50,-120 60,-60 C 50,-30 20,-8 0,0 Z"
            transform="rotate(0)" fill="url(#b1)"/>
      <path d="M 0,0 C -15,-50 -60,-120 -10,-155 C 15,-140 50,-120 60,-60 C 50,-30 20,-8 0,0 Z"
            transform="rotate(60)" fill="url(#b2)"/>
      <path d="M 0,0 C -15,-50 -60,-120 -10,-155 C 15,-140 50,-120 60,-60 C 50,-30 20,-8 0,0 Z"
            transform="rotate(120)" fill="url(#b3)"/>
      <path d="M 0,0 C -15,-50 -60,-120 -10,-155 C 15,-140 50,-120 60,-60 C 50,-30 20,-8 0,0 Z"
            transform="rotate(180)" fill="url(#b4)"/>
      <path d="M 0,0 C -15,-50 -60,-120 -10,-155 C 15,-140 50,-120 60,-60 C 50,-30 20,-8 0,0 Z"
            transform="rotate(240)" fill="url(#b5)"/>
      <path d="M 0,0 C -15,-50 -60,-120 -10,-155 C 15,-140 50,-120 60,-60 C 50,-30 20,-8 0,0 Z"
            transform="rotate(300)" fill="url(#b6)"/>
    </g>
  </g>

  <!-- Static center hub (does not rotate) -->
  <g transform="translate(300,300)">
    <circle cx="0" cy="0" r="30" fill="url(#hub)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="18" fill="#FEF3C7" opacity="0.9"/>
    <text x="0" y="7" text-anchor="middle" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="18" font-weight="700" fill="#92400E">&lt;/&gt;</text>
  </g>
</svg>
