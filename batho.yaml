# Batho configuration
# Auto-generated default config. Edit as needed for your project.

logging:
  level: INFO
  json_format: null
  quiet: false
  file: null
  format: "%(message)s"

paths:
  ctn_dir: .ctn

indexer:
  max_file_size_kb: 500
  max_indexed_files: 200000
  max_workers: 0
  max_files: null
  ignore_patterns: []
  ignore_files: null
  default_patterns_file: null
  metrics_output: .ctn/local/metrics/metrics.json
  fail_on_warning: false
  strict: false

patch:
  timeout_seconds: 300
  max_changes: 20000
  audit_log_path: .ctn/patch_audit.log
  history_days: 90
  max_count: 1000
  cleanup_on_startup: false

flags:
  fail_on_warning: false
  strict: false
  audit_log_enabled: true

rules:
  enabled: true
  auto_load_all_plugins: true
  builtin_plugins:
    - bsg_core
    - bsg_silent_failure_catcher
    - bsg_dependency_blast_radius
    - bsg_resource_leak_preventer
    - bsg_nplus1_query_catcher
    - bsg_iac_drift_sentinel
    - bsg_schema_migration_enforcer
    - bsg_api_contract_guardian
    - bsg_hardcoded_secret_catcher
    - bsg_auth_boundary_shield
  disabled_rules: []
  custom_rules_path: null
  custom_rules_inline: []
  strict_validation: false
  cache_ttl: 3600
  fail_on_rule_error: false

plugins:
  overrides: {}

hooks:
  enabled: true
  include: true

schemas:
  graph: graph.v1
  bsg: bsg.v1
  snapshot: snapshot.v1
  index_metadata: index-metadata.v1
  file_cache: file-cache.v1

cloud_sync:
  enabled: false
  endpoint: ""
  api_key: ""
  organization_id: ""
  project_id: ""
  timeout_seconds: 300
  max_retries: 3
  batch_size: 10

bsg:
  parallel:
    enabled: true
    max_workers: 16
    chunk_size: 50
  ignore:
    enabled: true
    file: ""  # Deprecated: .bathoignore support removed
  cache:
    enabled: true
    path: .ctn/local/cache.db
    max_size_mb: 1024
    ttl_days: 30
  incremental:
    enabled: true
    fallback_to_full: true
    auto_detect_git: true
  symbol_resolution:
    enabled: true
    fuzzy_matching: false
    cache_symbols: true
  serialization:
    method: legacy
    compression: false
    batch_size: 1000
  parsing:
    error_recovery: true
    partial_parsing: false
    max_file_size_mb: 10
    skip_comments: false
  query:
    enabled: true
    index_on_write: true
    cache_enabled: true
    cache_size: 256
    default_limit: 200
    query_timeout_ms: 5000
  storage:
    enabled: true
    backend: sqlite
    registry_path: .ctn/local/sync/artifact_registry.db
    content_scope: durable
    strict_compatibility: true
    cloud_sync_ready: true
    track_content_ids: true
    mmap_enabled: false
    mmap_min_size_mb: 8
    retention:
      enabled: true
      snapshot_ttl_days: 90
      patch_ttl_days: 90
      metrics_ttl_days: 30
      context_ttl_days: 90
      max_snapshots: 500
      max_patches: 5000
