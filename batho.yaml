schema_version: batho-config.v1
logging:
  level: ERROR
  json_format: null
  quiet: false
  file: null
  format: '%(message)s'
paths:
  artifact_dir: .batho/artifact
  cache_dir: .batho/cache
  bsg_dir: .batho/bsg
indexer:
  max_file_size_kb: 500
  max_indexed_files: 200000
  max_workers: 0
  ignore_patterns: []
  ignore_files: null
  default_patterns_file: null
  fail_on_warning: false
  strict: false
graph:
  backend:
    backend: auto
    auto_threshold_files: 500
    auto_threshold_entities: 30000
    arrow_staging_dir: .batho/graph_staging
    arrow_flush_rows: 5000
    arrow_flush_bytes_mb: 1.0
    arrow_recompact_delta_ratio: 0.1
  cycle_detection:
    enabled: true
    fatal: false
  orphan_pruning:
    enabled: true
    keep_entry_points: true
    keep_exports: true
flags:
  fail_on_warning: false
  strict: false
  audit_log_enabled: true
rules:
  enabled: true
  auto_load_all_plugins: true
  builtin_plugins:
  - bsg_core
  - bsg_silent_failure_catcher
  - bsg_dependency_blast_radius
  - bsg_resource_leak_preventer
  - bsg_nplus1_query_catcher
  - bsg_iac_drift_sentinel
  - bsg_schema_migration_enforcer
  - bsg_api_contract_guardian
  - bsg_hardcoded_secret_catcher
  - bsg_auth_boundary_shield
  disabled_rules: []
  custom_rules_path: null
  custom_rules_inline: []
  strict_validation: false
  cache_ttl: 3600
  fail_on_rule_error: false
plugins:
  overrides: {}
artifact_blobs:
  file_artifacts:
    bsg_agent_view: true
    bsg_storage_view: true
    bsg_rel_view: true
  run_artifacts:
    context_overview: true
    telemetry_metrics: true
    structural_metrics: true
    security_audit: false
    artifact_payload: true
    delta_stats: true
persistence:
  batch_size: 500
  batch_bytes_threshold: 15728640
memory:
  warning_threshold_mb: 800.0
  critical_threshold_mb: 1500.0
  rss_flush_threshold_mb: 1000.0
  max_per_worker_mb: 150.0
bsg:
  parallel:
    enabled: true
    max_workers: 16
    chunk_size: 50
  cache:
    enabled: true
    max_size_mb: 1024
    ttl_days: 30
  symbol_resolution:
    enabled: true
    fuzzy_matching: false
    cache_symbols: true
    prune_unresolved: true
    max_unresolved_attempts: 10
    unresolved_tracking: true
  parsing:
    error_recovery: true
    skip_comments: false
  bidirectional:
    enabled: true
    include_gaps: true
    verify_integrity: false
    storage_view: false
dependency:
  enabled: true
  introspection:
    enabled: true
    mode: shallow
    venv_auto_detect: true
    timeout_seconds: 5
    full_scan: false
    popular_packages_db_path: null
  stdlib:
    enabled: true
    languages:
    - python
    - javascript
    - go
    - rust
  cache:
    enabled: true
    ttl_days: 90
  max_deps_per_manifest: 500
extraction:
  cache:
    enabled: true
    ttl_days: 30
    max_entries: 5000
community_detection:
  enabled: true
  skip_threshold: 200000
  sample_threshold: 100000
