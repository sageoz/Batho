logging:
  level: INFO             # DEBUG | INFO | WARNING | ERROR | CRITICAL
  json_format: false        # true = JSON logs, false = console logs, null = auto
  quiet: false              # Suppress all non-error output
  file: null               # Optional log file path (e.g. .ctn/batho.log)
  format: "%(message)s"    # Log format string

paths:
  ctn_dir: .ctn

indexer:
  max_file_size_kb: 500
  max_indexed_files: 200000
  max_workers: 0
  max_files: null
  ignore_patterns: []
  ignore_files: null
  metrics_output: .ctn/metrics.json
  fail_on_warning: false
  strict: false

patch:
  timeout_seconds: 300
  max_changes: 10000
  audit_log_path: .ctn/patch_audit.log
  history_days: 90
  max_count: 1000
  cleanup_on_startup: false

flags:
  fail_on_warning: false
  strict: false
  audit_log_enabled: true

schemas:
  graph: graph.v1
  bsg: bsg.v1
  snapshot: snapshot.v1
  index_metadata: index-metadata.v1
  file_cache: file-cache.v1

bsg:
  parallel:
    enabled: true
    max_workers: 16
    chunk_size: 50
  ignore:
    enabled: true
    file: .bathoignore
  cache:
    enabled: true
    path: ~/.batho/ast_cache.db
    max_size_mb: 1024
    ttl_days: 30
  serialization:
    method: streaming
    compression: false
    batch_size: 1000
  parsing:
    error_recovery: true
    partial_parsing: false
    max_file_size_mb: 10
    skip_comments: false
  query:
    enabled: true
    index_on_write: true
    cache_enabled: true
    cache_size: 256
    default_limit: 200
    query_timeout_ms: 5000
  storage:
    enabled: true
    backend: sqlite
    registry_path: .ctn/artifact_registry.db
    content_scope: durable
    strict_compatibility: true
    cloud_sync_ready: true
    track_content_ids: true
    mmap_enabled: false
    mmap_min_size_mb: 8
    retention:
      enabled: true
      snapshot_ttl_days: 90
      patch_ttl_days: 90
      metrics_ttl_days: 30
      context_ttl_days: 90
      max_snapshots: 500
      max_patches: 5000
